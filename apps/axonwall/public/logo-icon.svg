<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="100%" height="100%">
  <defs>
    <clipPath id="brickClip">
      <rect x="2" y="2" width="44" height="44" rx="9" />
    </clipPath>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#061c18" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="axonLine" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="axeHaft" x1="10" y1="12" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="axeBladeLeft" x1="3" y1="10" x2="14" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="axeBladeRight" x1="45" y1="10" x2="34" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="24" cy="23" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Back Layer: Fortified Dark Brick Wall -->
  <g clip-path="url(#brickClip)">
    <rect x="2" y="2" width="44" height="44" rx="9" fill="#070b12" />
    <g stroke="#10b981" stroke-opacity="0.22" stroke-width="0.65">
      <rect x="2.5" y="3" width="12.5" height="6" rx="0.8" fill="#0f172a" />
      <rect x="16" y="3" width="15" height="6" rx="0.8" fill="#111c2d" />
      <rect x="32" y="3" width="13.5" height="6" rx="0.8" fill="#0f172a" />

      <rect x="2.5" y="10" width="7" height="6" rx="0.8" fill="#111c2d" />
      <rect x="10.5" y="10" width="13" height="6" rx="0.8" fill="#0f172a" />
      <rect x="24.5" y="10" width="13" height="6" rx="0.8" fill="#111c2d" />
      <rect x="38.5" y="10" width="7" height="6" rx="0.8" fill="#0f172a" />

      <rect x="2.5" y="17" width="13" height="6" rx="0.8" fill="#0f172a" />
      <rect x="16.5" y="17" width="15" height="6" rx="0.8" fill="#0b1524" />
      <rect x="32.5" y="17" width="13" height="6" rx="0.8" fill="#0f172a" />

      <rect x="2.5" y="24" width="7.5" height="6" rx="0.8" fill="#111c2d" />
      <rect x="11" y="24" width="12.5" height="6" rx="0.8" fill="#0f172a" />
      <rect x="24.5" y="24" width="12.5" height="6" rx="0.8" fill="#111c2d" />
      <rect x="38" y="24" width="7.5" height="6" rx="0.8" fill="#0f172a" />

      <rect x="2.5" y="31" width="13" height="6" rx="0.8" fill="#0f172a" />
      <rect x="16.5" y="31" width="15" height="6" rx="0.8" fill="#111c2d" />
      <rect x="32.5" y="31" width="13" height="6" rx="0.8" fill="#0f172a" />

      <rect x="2.5" y="38" width="8" height="6.5" rx="0.8" fill="#111c2d" />
      <rect x="11.5" y="38" width="12" height="6.5" rx="0.8" fill="#0f172a" />
      <rect x="24.5" y="38" width="12" height="6.5" rx="0.8" fill="#111c2d" />
      <rect x="37.5" y="38" width="8" height="6.5" rx="0.8" fill="#0f172a" />
    </g>
    <rect x="2" y="2" width="44" height="44" rx="9" stroke="#10b981" stroke-opacity="0.32" stroke-width="1" fill="none" />
  </g>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="24" cy="23" r="18" fill="url(#centerGlow)" />

  <!-- Middle Layer: Outer Cyber Shield Body -->
  <path
    d="M24 5.5 L38.5 10.2 C38.5 10.2 39 24 24 42.5 C9 24 9.5 10.2 9.5 10.2 L24 5.5 Z"
    fill="url(#shieldGrad)"
    stroke="url(#shieldBorder)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Inner Inset Shield Border -->
  <path
    d="M24 9.2 L35.2 13 C35.2 13 35.6 23 24 37.8 C12.4 23 12.8 13 12.8 13 L24 9.2 Z"
    stroke="#10b981"
    stroke-opacity="0.28"
    stroke-width="0.9"
    fill="none"
  />

  <!-- Axon Synaptic Pathways -->
  <g filter="url(#neonGlow)">
    <path d="M24 12.5 L24 21.5" stroke="url(#axonLine)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M24 21.5 L16.5 17" stroke="url(#axonLine)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M24 21.5 L31.5 17" stroke="url(#axonLine)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M24 21.5 L17.5 28" stroke="url(#axonLine)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M24 21.5 L30.5 28" stroke="url(#axonLine)" stroke-width="1.4" stroke-linecap="round" />

    <path d="M16.5 17 L13.5 19.5" stroke="url(#axonLine)" stroke-width="1.1" stroke-linecap="round" />
    <path d="M31.5 17 L34.5 19.5" stroke="url(#axonLine)" stroke-width="1.1" stroke-linecap="round" />

    <circle cx="24" cy="12.5" r="2" fill="#34d399" />
    <circle cx="16.5" cy="17" r="1.8" fill="#38bdf8" />
    <circle cx="31.5" cy="17" r="1.8" fill="#38bdf8" />
    <circle cx="17.5" cy="28" r="1.8" fill="#10b981" />
    <circle cx="30.5" cy="28" r="1.8" fill="#10b981" />

    <circle cx="24" cy="21.5" r="3.1" fill="#042f2e" stroke="#34d399" stroke-width="1.7" />
    <circle cx="24" cy="21.5" r="1.3" fill="#ffffff" />
  </g>

  <!-- Front Layer: Twin Battle Axes Crossing in Front of the Shield -->
  <g>
    <path d="M10.5 13 L35 41" stroke="#020617" stroke-opacity="0.85" stroke-width="3.8" stroke-linecap="round" />
    <path d="M37.5 13 L13 41" stroke="#020617" stroke-opacity="0.85" stroke-width="3.8" stroke-linecap="round" />

    <path d="M10.5 13 L35 41" stroke="url(#axeHaft)" stroke-width="2.1" stroke-linecap="round" />
    <path d="M11.4 11.4 L6.2 11.4 L2.6 10.2 C1.8 14 3.2 18.2 6.4 21.6 L9.8 17.6 L12.2 15.6 Z" fill="url(#axeBladeLeft)" stroke="#34d399" stroke-width="1.1" stroke-linejoin="round" />
    <path d="M11.8 11.8 L13.8 10.6 L13.1 13.8" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M37.5 13 L13 41" stroke="url(#axeHaft)" stroke-width="2.1" stroke-linecap="round" />
    <path d="M36.6 11.4 L41.8 11.4 L45.4 10.2 C46.2 14 44.8 18.2 41.6 21.6 L38.2 17.6 L35.8 15.6 Z" fill="url(#axeBladeRight)" stroke="#38bdf8" stroke-width="1.1" stroke-linejoin="round" />
    <path d="M36.2 11.8 L34.2 10.6 L34.9 13.8" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
