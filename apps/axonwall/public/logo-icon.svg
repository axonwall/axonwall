<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#061c18" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="axonLine" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="24" cy="23" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="24" cy="23" r="16" fill="url(#centerGlow)" />

  <!-- Outer Cyber Shield Body -->
  <path
    d="M24 4.5 L39.5 9.5 C39.5 9.5 40 24 24 43.5 C8 24 8.5 9.5 8.5 9.5 L24 4.5 Z"
    fill="url(#shieldGrad)"
    stroke="url(#shieldBorder)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Inner Inset Shield Border -->
  <path
    d="M24 8.5 L36 12.5 C36 12.5 36.5 23 24 38.5 C11.5 23 12 12.5 12 12.5 L24 8.5 Z"
    stroke="#10b981"
    stroke-opacity="0.25"
    stroke-width="1"
    fill="none"
  />

  <!-- Axon Synaptic Pathways (Packet Routing Network) -->
  <g filter="url(#neonGlow)">
    <!-- Circuit Lines -->
    <path d="M24 13 L24 23" stroke="url(#axonLine)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M24 23 L16 18" stroke="url(#axonLine)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M24 23 L32 18" stroke="url(#axonLine)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M24 23 L17 31" stroke="url(#axonLine)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M24 23 L31 31" stroke="url(#axonLine)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Branching Sub-circuits -->
    <path d="M16 18 L12.5 21" stroke="url(#axonLine)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M32 18 L35.5 21" stroke="url(#axonLine)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Synapse Nodes -->
    <circle cx="24" cy="13" r="2.2" fill="#34d399" />
    <circle cx="16" cy="18" r="2" fill="#38bdf8" />
    <circle cx="32" cy="18" r="2" fill="#38bdf8" />
    <circle cx="17" cy="31" r="2" fill="#10b981" />
    <circle cx="31" cy="31" r="2" fill="#10b981" />

    <!-- Core Nerve Center (Processor / nftables engine) -->
    <circle cx="24" cy="23" r="3.2" fill="#042f2e" stroke="#34d399" stroke-width="1.8" />
    <circle cx="24" cy="23" r="1.3" fill="#ffffff" />
  </g>
</svg>
