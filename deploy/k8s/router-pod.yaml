apiVersion: v1
kind: Pod
metadata:
  name: axonwall-edge-router
  namespace: axonwall
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      {"name": "macvlan-wan", "interface": "net1"},
      {"name": "macvlan-lan", "interface": "net2"}
    ]'
spec:
  containers:
    - name: router
      image: ghcr.io/axonwall/axonwalld:v0.3.0
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      volumeMounts:
        - name: config
          mountPath: /etc/axonwall
  volumes:
    - name: config
      configMap:
        name: axonwall-router-config
