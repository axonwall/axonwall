apiVersion: v1
kind: Pod
metadata:
  name: axonwall-edge-router
  namespace: axonwall
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      {"name": "macvlan-wan", "interface": "net1"},
      {"name": "macvlan-lan", "interface": "net2"}
    ]'
spec:
  automountServiceAccountToken: false
  securityContext:
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: seed-config
      image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command:
        - sh
        - -c
        - cp -f /etc/axonwall-seed/* /etc/axonwall/ 2>/dev/null || true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: config-seed
          mountPath: /etc/axonwall-seed
          readOnly: true
        - name: config
          mountPath: /etc/axonwall
  containers:
    - name: router
      image: ghcr.io/axonwall/axonwalld:v0.16.4
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
          add:
            - NET_ADMIN
            - NET_RAW
            - BPF
            - PERFMON
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      volumeMounts:
        - name: config
          mountPath: /etc/axonwall
        - name: tmp
          mountPath: /tmp
        - name: run
          mountPath: /run
  volumes:
    - name: config-seed
      configMap:
        name: axonwall-router-config
    - name: config
      emptyDir: {}
    - name: tmp
      emptyDir: {}
    - name: run
      emptyDir: {}
