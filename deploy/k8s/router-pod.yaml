apiVersion: v1
kind: Pod
metadata:
  name: axonwall-edge-router
  namespace: axonwall
  annotations:
    k8s.v1.cni.cncf.io/networks: '[
      {"name": "macvlan-wan", "interface": "net1"},
      {"name": "macvlan-lan", "interface": "net2"}
    ]'
spec:
  initContainers:
    - name: seed-config
      image: busybox:1.36
      command:
        - sh
        - -c
        - cp -f /etc/axonwall-seed/* /etc/axonwall/ 2>/dev/null || true
      volumeMounts:
        - name: config-seed
          mountPath: /etc/axonwall-seed
          readOnly: true
        - name: config
          mountPath: /etc/axonwall
  containers:
    - name: router
      image: ghcr.io/axonwall/axonwalld:v0.13.0
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      volumeMounts:
        - name: config
          mountPath: /etc/axonwall
  volumes:
    - name: config-seed
      configMap:
        name: axonwall-router-config
    - name: config
      emptyDir: {}
