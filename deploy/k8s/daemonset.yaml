apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: axonwall-node-firewall
  namespace: kube-system
  labels:
    app.kubernetes.io/name: axonwall-node-firewall
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: axonwall-node-firewall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonwall-node-firewall
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: axonwalld
          image: ghcr.io/axonwall/axonwalld:v0.16.3
          env:
            - name: AXONWALL_SOCKET_GROUP
              value: "1001"
            - name: AXONWALL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: axonwall-auth-secret
                  key: agent-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
                - BPF
                - PERFMON
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
            - name: run-socket
              mountPath: /run/axonwalld
            - name: var-lib
              mountPath: /var/lib/axonwall
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: run-socket
          hostPath:
            path: /run/axonwalld
            type: DirectoryOrCreate
        - name: var-lib
          hostPath:
            path: /var/lib/axonwall
            type: DirectoryOrCreate
        - name: modules
          hostPath:
            path: /lib/modules
