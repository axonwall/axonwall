apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: axonwall-node-firewall
  namespace: kube-system
  labels:
    app.kubernetes.io/name: axonwall-node-firewall
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: axonwall-node-firewall
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonwall-node-firewall
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: axonwalld
          image: ghcr.io/axonwall/axonwalld:v0.11.42
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: run-socket
              mountPath: /run/axonwalld
            - name: var-lib
              mountPath: /var/lib/axonwall
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: run-socket
          hostPath:
            path: /run/axonwalld
            type: DirectoryOrCreate
        - name: var-lib
          hostPath:
            path: /var/lib/axonwall
            type: DirectoryOrCreate
        - name: modules
          hostPath:
            path: /lib/modules
