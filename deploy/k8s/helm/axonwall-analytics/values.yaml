namespaceOverride: ""

storageClass: "axonwall-zfs-local"

global:
  imagePullPolicy: IfNotPresent

clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8-alpine"
    digest: "sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5"
  database: "axonwall"
  username: "admin"
  password: ""
  retention:
    rawDays: 30
    rollupDays: 180
  persistence:
    enabled: true
    size: 100Gi
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"

victoriametrics:
  enabled: true
  image:
    repository: victoriametrics/victoria-metrics
    tag: "v1.156.0"
    digest: "sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970"
  retentionPeriod: "90d"
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

victorialogs:
  enabled: true
  image:
    repository: victoriametrics/victoria-logs
    tag: "v1.24.0-victorialogs"
    digest: "sha256:1ec31ddccc39dc9ead2607cddbf2829be1eb5ad39890e72bba26b359be20801d"
  retentionPeriod: "30d"
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

collector:
  enabled: true
  replicas: 1
  axonwalld:
    image:
      repository: ghcr.io/axonwall/axonwalld
      tag: "v0.16.3"
      # Pin immutable sha256:... digest in production deployments
      digest: ""
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  ui:
    enabled: true
    image:
      repository: ghcr.io/axonwall/axonwall-ui
      tag: "v0.16.3"
      # Pin immutable sha256:... digest in production deployments
      digest: ""
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  ports:
    ui: 3000
    ipfixTls: 4739
    netflowUdp: 2055
    ipfixUdp: 4739
    sflowUdp: 6343
  persistence:
    enabled: true
    stateSize: 10Gi

controller:
  enabled: false
  image:
    repository: ghcr.io/axonwall/axonwall-controller
    tag: "v0.16.3"
    # Pin immutable sha256:... digest in production deployments
    digest: ""
  port: 2966
  resources:
    requests:
      cpu: "100m"
      memory: "192Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

librenms:
  enabled: false
  image:
    repository: librenms/librenms
    tag: "24.10.1"
    digest: "sha256:4f33023b6006ddada75e9f610f09b1eb26a19df7d92c35011ad815959e6bd45e"
  timezone: "UTC"
  db:
    # Set host to connect to an external MariaDB/MySQL instance; otherwise an embedded
    # MariaDB sidecar runs in the LibreNMS pod so LibreNMS starts out of the box.
    embedded: true
    host: ""
    port: 3306
    name: "librenms"
    user: "librenms"
    password: ""
    image:
      repository: mariadb
      tag: "11.4.5"
      digest: "sha256:49117dcc565cf51aa57ac5fca59ab31213402ff0eae6ffc13c46a37b938f7e4b"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

auth:
  # Leave blank to auto-generate (and preserve across helm upgrades via lookup), or inject sealed secrets via existingSecret
  existingSecret: ""
  agentToken: ""
  jwtSecret: ""
  ztpToken: ""
  localAdminUser: "admin"
  localAdminPassword: ""
  observabilityIngestToken: ""
  librenmsAppKey: ""

service:
  uiType: ClusterIP
  ingestType: ClusterIP
  annotations: {}

networkPolicy:
  enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: "analytics.axonwall.local"
  # Set tlsSecretName whenever ingress.enabled=true so UI sessions and ingest tokens are encrypted with TLS.
  tlsSecretName: ""
  # Fail Helm rendering when ingress.enabled=true without tlsSecretName (set false only if TLS is terminated upstream).
  requireTls: true
