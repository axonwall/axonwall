clickhouse:
  retention:
    rawDays: 30
    rollupDays: 180
  persistence:
    size: 100Gi
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"

victoriametrics:
  retentionPeriod: "90d"
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

victorialogs:
  retentionPeriod: "30d"
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
