{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "axonwall-analytics.secretName" . -}}
{{- $ns := include "axonwall-analytics.namespace" . -}}
{{- $existing := (lookup "v1" "Secret" $ns $secretName) | default dict -}}
{{- $existingData := ($existing.data | default dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
type: Opaque
data:
  agent-token: {{ if .Values.auth.agentToken }}{{ .Values.auth.agentToken | b64enc | quote }}{{ else if hasKey $existingData "agent-token" }}{{ index $existingData "agent-token" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
  jwt-secret: {{ if .Values.auth.jwtSecret }}{{ .Values.auth.jwtSecret | b64enc | quote }}{{ else if hasKey $existingData "jwt-secret" }}{{ index $existingData "jwt-secret" | quote }}{{ else }}{{ randAlphaNum 48 | b64enc | quote }}{{ end }}
  ztp-token: {{ if .Values.auth.ztpToken }}{{ .Values.auth.ztpToken | b64enc | quote }}{{ else if hasKey $existingData "ztp-token" }}{{ index $existingData "ztp-token" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
  local-admin-user: {{ (.Values.auth.localAdminUser | default "admin") | b64enc | quote }}
  local-admin-password: {{ if .Values.auth.localAdminPassword }}{{ .Values.auth.localAdminPassword | b64enc | quote }}{{ else if hasKey $existingData "local-admin-password" }}{{ index $existingData "local-admin-password" | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
  clickhouse-password: {{ if .Values.clickhouse.password }}{{ .Values.clickhouse.password | b64enc | quote }}{{ else if hasKey $existingData "clickhouse-password" }}{{ index $existingData "clickhouse-password" | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
  observability-ingest-token: {{ if .Values.auth.observabilityIngestToken }}{{ .Values.auth.observabilityIngestToken | b64enc | quote }}{{ else if hasKey $existingData "observability-ingest-token" }}{{ index $existingData "observability-ingest-token" | quote }}{{ else }}{{ randAlphaNum 40 | b64enc | quote }}{{ end }}
  librenms-db-password: {{ if .Values.librenms.db.password }}{{ .Values.librenms.db.password | b64enc | quote }}{{ else if hasKey $existingData "librenms-db-password" }}{{ index $existingData "librenms-db-password" | quote }}{{ else }}{{ randAlphaNum 24 | b64enc | quote }}{{ end }}
  librenms-app-key: {{ if .Values.auth.librenmsAppKey }}{{ .Values.auth.librenmsAppKey | b64enc | quote }}{{ else if hasKey $existingData "librenms-app-key" }}{{ index $existingData "librenms-app-key" | quote }}{{ else }}{{ printf "base64:%s" (randAlphaNum 32 | b64enc) | b64enc | quote }}{{ end }}
{{- end }}
