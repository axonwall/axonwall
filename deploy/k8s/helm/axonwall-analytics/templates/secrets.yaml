{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axonwall-analytics.secretName" . }}
  namespace: {{ include "axonwall-analytics.namespace" . }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
type: Opaque
data:
  agent-token: {{ (.Values.auth.agentToken | default (randAlphaNum 32)) | b64enc | quote }}
  jwt-secret: {{ (.Values.auth.jwtSecret | default (randAlphaNum 48)) | b64enc | quote }}
  clickhouse-password: {{ (.Values.clickhouse.password | default (randAlphaNum 24)) | b64enc | quote }}
  observability-ingest-token: {{ (.Values.auth.observabilityIngestToken | default "") | b64enc | quote }}
{{- end }}
