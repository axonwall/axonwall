{{- if .Values.ingress.enabled }}
{{- $requireTls := ternary .Values.ingress.requireTls true (hasKey .Values.ingress "requireTls") -}}
{{- if and $requireTls (not .Values.ingress.tlsSecretName) -}}
{{- fail "ingress.enabled=true requires ingress.tlsSecretName so UI sessions and ingest tokens are protected by TLS (set ingress.requireTls=false only if TLS is terminated upstream)" -}}
{{- end -}}
{{- $fullname := include "axonwall-analytics.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  namespace: {{ include "axonwall-analytics.namespace" . }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  # TLS is strongly enforced via ingress.requireTls=true (default); set ingress.tlsSecretName
  # to a valid Kubernetes TLS Secret whenever ingress.enabled=true.
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.victoriametrics.enabled }}
          - path: /vm
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-obs-proxy
                port:
                  number: 8480
          {{- end }}
          {{- if .Values.victorialogs.enabled }}
          - path: /vl
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-obs-proxy
                port:
                  number: 8480
          {{- end }}
          {{- if and .Values.collector.enabled .Values.collector.ui.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-ui
                port:
                  number: {{ .Values.collector.ports.ui }}
          {{- end }}
{{- end }}
