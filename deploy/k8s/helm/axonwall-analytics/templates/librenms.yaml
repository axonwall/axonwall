{{- if .Values.librenms.enabled }}
{{- $fullname := include "axonwall-analytics.fullname" . -}}
{{- $ns := include "axonwall-analytics.namespace" . -}}
{{- $useEmbeddedDb := and (not .Values.librenms.db.host) .Values.librenms.db.embedded -}}
{{- if not (or .Values.librenms.db.host .Values.librenms.db.embedded) -}}
{{- fail "librenms.enabled requires either librenms.db.host (external MariaDB/MySQL) or librenms.db.embedded=true" -}}
{{- end -}}
{{- if .Values.librenms.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-librenms-data
  namespace: {{ $ns }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.librenms.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-librenms
  namespace: {{ $ns }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: librenms
spec:
  replicas: 1
  {{- if .Values.librenms.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: librenms
  template:
    metadata:
      labels:
        {{- include "axonwall-analytics.labels" . | nindent 8 }}
        app.kubernetes.io/component: librenms
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- if $useEmbeddedDb }}
        - name: mariadb
          image: "{{ .Values.librenms.db.image.repository }}:{{ .Values.librenms.db.image.tag }}{{- if .Values.librenms.db.image.digest }}@{{ .Values.librenms.db.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.librenms.db.name | quote }}
            - name: MARIADB_USER
              value: {{ .Values.librenms.db.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "axonwall-analytics.secretName" . }}
                  key: librenms-db-password
            - name: MARIADB_RANDOM_ROOT_PASSWORD
              value: "yes"
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MARIADB_PASSWORD\" exec mariadb-admin ping -h 127.0.0.1 -u\"$MARIADB_USER\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.librenms.db.resources | nindent 12 }}
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
        {{- end }}
        - name: librenms
          image: "{{ .Values.librenms.image.repository }}:{{ .Values.librenms.image.tag }}{{- if .Values.librenms.image.digest }}@{{ .Values.librenms.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: TZ
              value: {{ .Values.librenms.timezone | quote }}
            - name: DB_HOST
              value: {{ if $useEmbeddedDb }}"127.0.0.1"{{ else }}{{ .Values.librenms.db.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ .Values.librenms.db.port | default 3306 | quote }}
            - name: DB_NAME
              value: {{ .Values.librenms.db.name | quote }}
            - name: DB_USER
              value: {{ .Values.librenms.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "axonwall-analytics.secretName" . }}
                  key: librenms-db-password
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axonwall-analytics.secretName" . }}
                  key: librenms-app-key
          ports:
            - name: http
              containerPort: 8000
          resources:
            {{- toYaml .Values.librenms.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.librenms.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-librenms-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $useEmbeddedDb }}
        - name: db-data
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-librenms
  namespace: {{ $ns }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: librenms
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
