{{- if .Values.victorialogs.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "axonwall-analytics.fullname" . }}-vl
  namespace: {{ include "axonwall-analytics.namespace" . }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: victorialogs
spec:
  serviceName: {{ include "axonwall-analytics.fullname" . }}-vl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: victorialogs
  template:
    metadata:
      labels:
        {{- include "axonwall-analytics.labels" . | nindent 8 }}
        app.kubernetes.io/component: victorialogs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victorialogs
          image: "{{ .Values.victorialogs.image.repository }}:{{ .Values.victorialogs.image.tag }}{{- if .Values.victorialogs.image.digest }}@{{ .Values.victorialogs.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - "-retentionPeriod={{ .Values.victorialogs.retentionPeriod }}"
            - "-storageDataPath=/vl-data"
            - "-httpListenAddr=:9428"
            - "-http.pathPrefix=/vl"
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet:
              path: /vl/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.victorialogs.resources | nindent 12 }}
          volumeMounts:
            - name: vl-data
              mountPath: /vl-data
      {{- if not .Values.victorialogs.persistence.enabled }}
      volumes:
        - name: vl-data
          emptyDir: {}
      {{- end }}
  {{- if .Values.victorialogs.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: vl-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.victorialogs.persistence.size | quote }}
  {{- end }}
{{- end }}
