{{- if .Values.victoriametrics.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "axonwall-analytics.fullname" . }}-vm
  namespace: {{ include "axonwall-analytics.namespace" . }}
  labels:
    {{- include "axonwall-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: victoriametrics
spec:
  serviceName: {{ include "axonwall-analytics.fullname" . }}-vm
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: victoriametrics
  template:
    metadata:
      labels:
        {{- include "axonwall-analytics.labels" . | nindent 8 }}
        app.kubernetes.io/component: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: "{{ .Values.victoriametrics.image.repository }}:{{ .Values.victoriametrics.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "-retentionPeriod={{ .Values.victoriametrics.retentionPeriod }}"
            - "-storageDataPath=/vm-data"
            - "-httpListenAddr=:8428"
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.victoriametrics.resources | nindent 12 }}
          volumeMounts:
            - name: vm-data
              mountPath: /vm-data
  volumeClaimTemplates:
    - metadata:
        name: vm-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.victoriametrics.persistence.size | quote }}
{{- end }}
