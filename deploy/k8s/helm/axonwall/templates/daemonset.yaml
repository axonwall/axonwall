{{- if .Values.nodeFirewall.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-axonwalld
  labels:
    app.kubernetes.io/name: axonwalld
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: axonwalld
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonwalld
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoExecute
      containers:
        - name: axonwalld
          image: "{{ .Values.nodeFirewall.image.repository }}:{{ .Values.nodeFirewall.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: AXONWALL_SOCKET_GROUP
              value: "1001"
            - name: AXONWALL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "axonwall-auth-secret" }}
                  key: {{ .Values.auth.agentTokenKey | default "agent-token" }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          volumeMounts:
            - name: run-axonwalld
              mountPath: /run/axonwalld
            - name: var-lib-axonwall
              mountPath: /var/lib/axonwall
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: run-axonwalld
          hostPath:
            path: /run/axonwalld
            type: DirectoryOrCreate
        - name: var-lib-axonwall
          hostPath:
            path: /var/lib/axonwall
            type: DirectoryOrCreate
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: DirectoryOrCreate
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    app.kubernetes.io/name: axonwall-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: axonwall-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonwall-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: axonwall-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: AGENT_API_SOCKET
              value: /run/axonwalld/agent-api.sock
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "axonwall-auth-secret" }}
                  key: {{ .Values.auth.jwtSecretKey | default "jwt-secret" }}
            - name: AXONWALL_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "axonwall-auth-secret" }}
                  key: {{ .Values.auth.agentTokenKey | default "agent-token" }}
            - name: LOCAL_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "axonwall-auth-secret" }}
                  key: {{ .Values.auth.localAdminUserKey | default "local-admin-user" }}
                  optional: true
            - name: LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "axonwall-auth-secret" }}
                  key: {{ .Values.auth.localAdminPasswordKey | default "local-admin-password" }}
            - name: LDAP_URL
              value: "ldap://{{ .Values.ldap.host | default "axonwall-ldap" }}:{{ .Values.ldap.port | default 389 }}"
            - name: LDAP_BASE_DN
              value: {{ .Values.ldap.baseDn | default "dc=axonwall,dc=internal" | quote }}
          volumeMounts:
            - name: run-axonwalld
              mountPath: /run/axonwalld
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 3000 }}
              protocol: TCP
      volumes:
        - name: run-axonwalld
          hostPath:
            path: /run/axonwalld
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    app.kubernetes.io/name: axonwall-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: axonwall-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
