{{- if .Values.nodeFirewall.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-axonwalld
  labels:
    app.kubernetes.io/name: axonwalld
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: axonwalld
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonwalld
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      containers:
        - name: axonwalld
          image: "{{ .Values.nodeFirewall.image.repository }}:{{ .Values.nodeFirewall.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          volumeMounts:
            - name: run-axonwalld
              mountPath: /run/axonwalld
            - name: var-lib-axonwall
              mountPath: /var/lib/axonwall
      volumes:
        - name: run-axonwalld
          hostPath:
            path: /run/axonwalld
            type: DirectoryOrCreate
        - name: var-lib-axonwall
          hostPath:
            path: /var/lib/axonwall
            type: DirectoryOrCreate
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    app.kubernetes.io/name: axonwall-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: axonwall-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axonwall-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: axonwall-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port | default 3000 }}
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    app.kubernetes.io/name: axonwall-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: axonwall-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
