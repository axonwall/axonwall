# Default values for axonwall Helm chart.
replicaCount: 1

image:
  repository: ghcr.io/axonwall/axonwall-ui
  pullPolicy: IfNotPresent
  tag: "v0.2.8"

service:
  type: ClusterIP
  port: 3000

nodeFirewall:
  enabled: true
  image:
    repository: ghcr.io/axonwall/axonwalld
    tag: "v0.2.8"

database:
  embedded: true
  host: "axonwall-supabase"
  port: 5432

ldap:
  embedded: true
  host: "axonwall-ldap"
  port: 389

observability:
  victoriaMetrics:
    enabled: true
  victoriaLogs:
    enabled: true
