# Default values for axonwall Helm chart.
replicaCount: 1

image:
  repository: ghcr.io/axonwall/axonwall-ui
  pullPolicy: IfNotPresent
  tag: "v0.14.0"

service:
  type: ClusterIP
  port: 3000

auth:
  # Secret containing mandatory JWT_SECRET and AXONWALL_AGENT_TOKEN keys.
  existingSecret: "axonwall-auth-secret"
  jwtSecretKey: "jwt-secret"
  agentTokenKey: "agent-token"

nodeFirewall:
  enabled: true
  image:
    repository: ghcr.io/axonwall/axonwalld
    tag: "v0.14.0"

database:
  embedded: true
  host: "axonwall-supabase"
  port: 5432

ldap:
  embedded: true
  host: "axonwall-ldap"
  baseDn: "dc=axonwall,dc=internal"
  port: 389

observability:
  victoriaMetrics:
    enabled: true
  victoriaLogs:
    enabled: true
