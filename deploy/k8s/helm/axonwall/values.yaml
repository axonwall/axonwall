# Default values for axonwall Helm chart.
replicaCount: 1

image:
  repository: ghcr.io/axonwall/axonwall-ui
  pullPolicy: IfNotPresent
  tag: "v0.16.3"
  # Pin immutable sha256:... digest in production deployments
  digest: ""

service:
  type: ClusterIP
  port: 3000

auth:
  # Secret containing mandatory JWT_SECRET, AXONWALL_AGENT_TOKEN, and local admin keys.
  existingSecret: "axonwall-auth-secret"
  jwtSecretKey: "jwt-secret"
  agentTokenKey: "agent-token"
  localAdminUserKey: "local-admin-user"
  localAdminPasswordKey: "local-admin-password"
  localAdminUserDefault: "admin"

nodeFirewall:
  enabled: true
  image:
    repository: ghcr.io/axonwall/axonwalld
    tag: "v0.16.3"
    # Pin immutable sha256:... digest in production deployments
    digest: ""

database:
  embedded: true
  host: "axonwall-supabase"
  port: 5432

ldap:
  embedded: true
  host: "axonwall-ldap"
  baseDn: "dc=axonwall,dc=internal"
  port: 636

observability:
  victoriaMetrics:
    enabled: true
  victoriaLogs:
    enabled: true
