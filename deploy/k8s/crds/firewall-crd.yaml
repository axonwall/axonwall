apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firewallpolicies.axonwall.io
spec:
  group: axonwall.io
  names:
    kind: FirewallPolicy
    listKind: FirewallPolicyList
    plural: firewallpolicies
    singular: firewallpolicy
    shortNames:
      - fwp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                priority:
                  type: integer
                  minimum: 1
                  maximum: 1000
                defaultAction:
                  type: string
                  enum: [pass, block, reject]
                rules:
                  type: array
                  items:
                    type: object
                    required: [action, protocol, direction]
                    properties:
                      action:
                        type: string
                        enum: [pass, block, reject]
                      protocol:
                        type: string
                        enum: [any, tcp, udp, icmp]
                      direction:
                        type: string
                        enum: [in, out]
                      interface:
                        type: string
                      source:
                        type: string
                      sourcePort:
                        type: string
                      destination:
                        type: string
                      destinationPort:
                        type: string
                      log:
                        type: boolean
            status:
              type: object
              properties:
                appliedRevision:
                  type: string
                state:
                  type: string
                  enum: [Pending, Applied, Failed]
                lastAppliedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
