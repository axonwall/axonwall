services:
  axonwalld:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.axonwalld
    container_name: axonwalld
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - /run/axonwalld:/run/axonwalld
      - /var/lib/axonwall:/var/lib/axonwall
      - /etc/nftables.d:/etc/nftables.d

  axonwall-ui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ui
    container_name: axonwall-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Required: the UI refuses to sign/verify sessions without a real
      # secret (there is no fallback). Generate one per deployment:
      #   JWT_SECRET=$(openssl rand -hex 32)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see comment above)}
      - SUPABASE_URL=http://supabase-db:54321
      - SUPABASE_ANON_KEY=local-dev-anon-key
      - LDAP_URL=ldap://openldap:389
      - LDAP_BIND_DN=cn=admin,dc=axonwall,dc=internal
      - LDAP_BIND_PASSWORD=adminpassword
      - AXONWALLD_SOCKET=/run/axonwalld/axonwalld.sock
    volumes:
      - /run/axonwalld:/run/axonwalld:ro
    depends_on:
      - openldap
      - supabase-db

  openldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    container_name: axonwall-ldap
    restart: unless-stopped
    ports:
      - "389:389"
    environment:
      - LDAP_ORGANISATION=Axonwall
      - LDAP_DOMAIN=axonwall.internal
      - LDAP_ADMIN_PASSWORD=adminpassword
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d

  supabase-db:
    image: supabase/postgres:17.11.0.006@sha256:c141fd17ac6a76c4323e90b3aee8ff1a23d2e89e547c2b963cfadc309c079cc2
    container_name: axonwall-supabase
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=postgres
    volumes:
      - supabase_data:/var/lib/postgresql/data

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0@sha256:4bd592341587d669b7f57d54bbb82bd21ac8675f4e24234b7703a7c0f85197d8
    container_name: axonwall-vm
    restart: unless-stopped
    ports:
      - "8428:8428"
    command:
      - "-retentionPeriod=30d"
      - "-storageDataPath=/vm-data"
    volumes:
      - vm_data:/vm-data

  victorialogs:
    image: victoriametrics/victoria-logs:v1.24.0-victorialogs@sha256:1ec31ddccc39dc9ead2607cddbf2829be1eb5ad39890e72bba26b359be20801d
    container_name: axonwall-vl
    restart: unless-stopped
    ports:
      - "9428:9428"
    command:
      - "-retentionPeriod=14d"
      - "-storageDataPath=/vl-data"
    volumes:
      - vl_data:/vl-data

volumes:
  openldap_data:
  openldap_config:
  supabase_data:
  vm_data:
  vl_data:
