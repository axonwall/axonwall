services:
  axonwalld:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.axonwalld
    container_name: axonwalld
    network_mode: host
    restart: unless-stopped
    command: ["--socket", "/run/axonwalld/agent.sock", "--boot-apply"]
    environment:
      - AXONWALL_SOCKET_GROUP=1001
      - AXONWALL_AGENT_TOKEN=${AXONWALL_AGENT_TOKEN:?AXONWALL_AGENT_TOKEN must be set}
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - /run/axonwalld:/run/axonwalld
      - /var/lib/axonwall:/var/lib/axonwall
      - /etc/nftables.d:/etc/nftables.d

  axonwall-ui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ui
    container_name: axonwall-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Required: the UI refuses to sign/verify sessions without a real
      # secret (there is no fallback). Generate one per deployment:
      #   JWT_SECRET=$(openssl rand -hex 32)
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (see comment above)}
      - AXONWALL_AGENT_TOKEN=${AXONWALL_AGENT_TOKEN:?AXONWALL_AGENT_TOKEN must be set}
      - AXONWALL_ZTP_TOKEN=${AXONWALL_ZTP_TOKEN:?AXONWALL_ZTP_TOKEN must be set}
      - LOCAL_ADMIN_USER=${LOCAL_ADMIN_USER:-admin}
      - LOCAL_ADMIN_PASSWORD=${LOCAL_ADMIN_PASSWORD:?LOCAL_ADMIN_PASSWORD must be set}
      - AGENT_SOCKET=/run/axonwalld/agent.sock
      - AGENT_API_SOCKET=/run/axonwalld/agent-api.sock
      - LDAP_URL=ldap://openldap:389
      - LDAP_BASE_DN=dc=axonwall,dc=internal
      - LDAP_BIND_DN=cn=admin,dc=axonwall,dc=internal
      - LDAP_BIND_PASSWORD=${LDAP_ADMIN_PASSWORD:?LDAP_ADMIN_PASSWORD must be set}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      - CLICKHOUSE_DB=axonwall
      - VICTORIAMETRICS_URL=http://victoriametrics:8428
      - VICTORIALOGS_URL=http://victorialogs:9428
      - CONTROLLER_URL=https://axonwall-controller:2966
      - NODE_EXTRA_CA_CERTS=/etc/axonwall/certs/ca.crt
    volumes:
      - /run/axonwalld:/run/axonwalld
      - axonwall_certs:/etc/axonwall/certs:ro
    depends_on:
      - openldap
      - supabase-db
      - clickhouse
      - victoriametrics
      - victorialogs
      - axonwall-controller

  axonwall-controller:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.controller
    container_name: axonwall-controller
    restart: unless-stopped
    ports:
      - "2966:2966"
    environment:
      - NODE_ENV=production
      - CONTROLLER_PORT=2966
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - AXONWALL_FLEET_ENABLED=1
      - AXONWALL_AGENT_TOKEN=${AXONWALL_AGENT_TOKEN:?AXONWALL_AGENT_TOKEN must be set}
      - AXONWALL_AGENT_API_SOCK=/run/axonwalld/agent-api.sock
      - AXONWALL_VM_IMPORT_URL=http://victoriametrics:8428/api/v1/import/prometheus
      - AXONWALL_VL_INSERT_URL=http://victorialogs:9428/insert/jsonline
      - AXONWALL_ZTP_TOKEN=${AXONWALL_ZTP_TOKEN:?AXONWALL_ZTP_TOKEN must be set}
    volumes:
      - /run/axonwalld:/run/axonwalld
      - axonwall_certs:/etc/axonwall/certs
    depends_on:
      - victoriametrics
      - victorialogs

  openldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    container_name: axonwall-ldap
    restart: unless-stopped
    ports:
      - "127.0.0.1:389:389"
    environment:
      - LDAP_ORGANISATION=Axonwall
      - LDAP_DOMAIN=axonwall.internal
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD:?LDAP_ADMIN_PASSWORD must be set}
    volumes:
      - ../ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bootstrap.ldif:ro
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d

  supabase-db:
    image: supabase/postgres:17.12.0.000@sha256:8630950b489ecc70563300180287a98c192a4a48f5ae00b4febdaeea1abe85de
    container_name: axonwall-supabase
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=postgres
    volumes:
      - supabase_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: axonwall-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      - CLICKHOUSE_DB=axonwall
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    container_name: axonwall-vm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"
    command:
      - "-retentionPeriod=90d"
      - "-storageDataPath=/vm-data"
    volumes:
      - vm_data:/vm-data

  victorialogs:
    image: victoriametrics/victoria-logs:v1.24.0-victorialogs@sha256:1ec31ddccc39dc9ead2607cddbf2829be1eb5ad39890e72bba26b359be20801d
    container_name: axonwall-vl
    restart: unless-stopped
    ports:
      - "127.0.0.1:9428:9428"
    command:
      - "-retentionPeriod=30d"
      - "-storageDataPath=/vl-data"
    volumes:
      - vl_data:/vl-data

volumes:
  axonwall_certs:
  openldap_data:
  openldap_config:
  supabase_data:
  clickhouse_data:
  vm_data:
  vl_data:
