#cloud-config
# Axonwall VM Cloud-Init bootstrap configuration
# Supported on KVM/Proxmox (qcow2), VMware (OVA), Hyper-V, AWS AMI, Azure, GCP

hostname: axonwall-vm
fqdn: axonwall-vm.local
manage_etc_hosts: true

users:
  - name: axonwall
    gecos: Axonwall Administrator
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGenericBootstrapKeyAxonwallDeployment admin@axonwall

packages:
  - nftables
  - iproute2
  - wireguard-tools
  - keepalived
  - conntrackd
  - qemu-guest-agent

runcmd:
  # Enable forwarding and IP parameters
  - sysctl -w net.ipv4.ip_forward=1
  - sysctl -w net.ipv6.conf.all.forwarding=1
  - sysctl -w net.netfilter.nf_conntrack_tcp_be_liberal=1
  # Start guest agent and firewall daemon
  - systemctl enable --now qemu-guest-agent || true
  - systemctl enable --now axonwalld || true
  - systemctl enable --now axonwall-ui || true
