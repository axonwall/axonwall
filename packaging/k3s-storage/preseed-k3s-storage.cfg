# Axonwall K3s + OpenZFS Storage Host Edition preseed -- derived from the
# Vault Edition preseed with the firewall/UI/directory package set absent and
# wireguard-tools, bridge-utils, iptables, and zfsutils-linux included for K3s
# Flannel WireGuard, CNI bridges, and OpenEBS ZFS-LocalPV.
# Axonwall Appliance Installation Configuration (Debian 13)

# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Appliance Edition Identity
d-i axonwall/appliance_edition string k3s-storage

# Network Configuration
# Skip interactive d-i netcfg prompts during offline ISO install
d-i netcfg/enable boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string axonwall-storage
d-i netcfg/get_domain string local

# Mirror & APT Settings (Offline-first installation)
d-i cdrom-detect/hybrid boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# Account Setup
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# NOTE: passwd/root-password is intentionally NOT preseeded so the installer
# interactively prompts the administrator to set their password.

# Clock & Time Zone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

# Automated Partitioning with Interactive Target Disk Selection
# Default to modern GPT partition table with hybrid BIOS/UEFI boot support
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/confirm_write_new_label boolean true

# Auto-purge stale LVM, MD raid, and unknown labels from previous installations
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/unknown_label boolean true

# Auto-handle non-fatal libparted partition commit warnings (e.g. temporary udev locks)
d-i partman/exception_handler select Ignore
d-i partman-base/exception_handler select Ignore

# partman-auto/method regular with dynamic A/B dual-root layout
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select axonwall-ab
d-i partman-auto/expert_recipe_file string /tmp/axonwall-ab-recipe
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Package Selection & K3s + OpenZFS Storage Host Base Services
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string \
  curl \
  wget \
  ca-certificates \
  gnupg \
  nftables \
  iptables \
  wireguard-tools \
  bridge-utils \
  iproute2 \
  ethtool \
  pciutils \
  tcpdump \
  jq \
  net-tools \
  openssl \
  rsync \
  python3 \
  zfsutils-linux \
  mdadm \
  gdisk \
  parted \
  smartmontools \
  cryptsetup \
  systemd-cryptsetup \
  tpm2-tools \
  xfsprogs \
  zsh \
  zsh-autosuggestions \
  zsh-syntax-highlighting \
  starship \
  zoxide \
  vim \
  tmux \
  fzf \
  ripgrep \
  fd-find \
  bat \
  mtr-tiny \
  btop \
  htop \
  sysstat \
  iotop \
  iftop \
  slurm \
  dnsutils \
  nmap

d-i pkgsel/upgrade select none

# Boot Loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/force-efi-extra-removable boolean true

# Early Cloud-Init seed detection (runs during file-preseed before netcfg & user-setup)
d-i preseed/include_command string sh /usr/lib/axonwall/detect-cloudinit --print-preseed

# Early preseed hook: load Axonwall debconf templates
d-i preseed/early_command string \
  chmod 755 /usr/lib/axonwall/* 2>/dev/null || true; \
  if [ -f /usr/lib/axonwall/axonwall.templates ]; then \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate user-setup /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate passwd /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate partman /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate axonwall /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
  fi

# Partman early hook: clean existing storage locks and install interactive target disk selection handler
d-i partman/early_command string \
  swapoff -a 2>/dev/null || true; \
  if command -v mdadm >/dev/null 2>&1; then \
    for md in /dev/md*; do [ -b "$md" ] && mdadm --stop "$md" 2>/dev/null || true; done; \
  fi; \
  if command -v cryptsetup >/dev/null 2>&1; then \
    cryptsetup close axon_crypt_data 2>/dev/null || true; \
  fi; \
  if command -v dmsetup >/dev/null 2>&1; then \
    for dm in $(dmsetup ls --target crypt 2>/dev/null | awk '{print $1}'); do dmsetup remove -f "$dm" 2>/dev/null || true; done; \
  fi; \
  if command -v zpool >/dev/null 2>&1; then \
    zpool export -a 2>/dev/null || true; \
  fi; \
  for mp in /target/boot/efi /target/var/log /target/var/lib/axonwall /target/mnt/* /target; do \
    umount -f "$mp" 2>/dev/null || true; \
  done; \
  udevadm settle 2>/dev/null || true; \
  if [ -f /usr/lib/axonwall/10initial_auto ]; then \
    cp /usr/lib/axonwall/10initial_auto /usr/lib/partman/display.d/10initial_auto 2>/dev/null || true; \
    cp /usr/lib/axonwall/10initial_auto /lib/partman/display.d/10initial_auto 2>/dev/null || true; \
    chmod 755 /usr/lib/partman/display.d/10initial_auto /lib/partman/display.d/10initial_auto 2>/dev/null || true; \
  fi; \
  if [ -f /usr/lib/axonwall/axonwall.templates ]; then \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate user-setup /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate passwd /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate partman /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    env -u DEBIAN_HAS_FRONTEND debconf-loadtemplate axonwall /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
  fi

# Post-Installation Hook: Enable K3s Storage Host Services
d-i preseed/late_command string \
  chmod +x /usr/lib/finish-install.d/* 2>/dev/null || true; \
  in-target systemctl enable axonwall-k3s-firstboot axonwall-k3s-verify k3s k3s-agent nftables systemd-networkd ssh cloud-init-local cloud-init cloud-config cloud-final; \
  in-target chsh -s /usr/bin/zsh root || true; \
  in-target mkdir -p /etc/axonwall /etc/ssh/sshd_config.d; \
  in-target touch /etc/axonwall/.k3s-firstboot /etc/axonwall/.k3s-edition;

# Finish installation and reboot
d-i finish-install/reboot_in_progress note
