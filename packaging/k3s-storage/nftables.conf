#!/usr/sbin/nft -f
# Axonwall K3s + ZFS Storage Host Edition -- isolated host firewall ruleset.
#
# CRITICAL: NEVER issue a global `flush ruleset` here! K3s kube-proxy and
# Flannel WireGuard manage their own nftables/iptables-nft chains dynamically;
# flushing the global ruleset would sever Pod/Service networking mid-flight.
# Instead, create-then-delete-then-recreate ONLY `table inet k3s_host_filter`
# idempotently.
table inet k3s_host_filter {}
delete table inet k3s_host_filter

table inet k3s_host_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept

        # Allow DHCPv4 / DHCPv6 client lease replies before conntrack establishes
        # (UDP 67 inbound is deliberately NOT opened: this host is never a DHCP server).
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Trust CNI bridge, Flannel overlay, and WireGuard mesh interfaces
        iifname { "cni0", "flannel*", "wg*" } accept

        # Host administration (SSH), Kubernetes API (6443), and Kubelet API (10250)
        tcp dport { 22, 6443, 10250 } accept

        # Flannel VXLAN (8472) and Flannel WireGuard IPv4/IPv6 (51820, 51821)
        udp dport { 8472, 51820, 51821 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        iifname { "cni0", "flannel*" } accept
        oifname { "cni0", "flannel*" } accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
