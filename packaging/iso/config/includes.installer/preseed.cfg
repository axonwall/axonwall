# Axonwall Appliance Installation Configuration (Debian 13)

# Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network Configuration
# Skip interactive d-i netcfg prompts during offline ISO install; axonwall-firstboot
# and cloud-init configure all network interfaces on first boot.
d-i netcfg/enable boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string axonwall
d-i netcfg/get_domain string local

# Mirror & APT Settings (Offline-first installation)
d-i cdrom-detect/hybrid boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# Account Setup
d-i passwd/root-login boolean true
d-i passwd/make-user boolean false
# NOTE: passwd/root-password is intentionally NOT preseeded so the installer
# interactively prompts the administrator to set their password.

# Clock & Time Zone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

# Automated Partitioning with Interactive Target Disk Selection
# Default to modern GPT partition table with hybrid BIOS/UEFI boot support
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/confirm_write_new_label boolean true

# partman-auto/method regular with dynamic A/B dual-root layout
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select axonwall-ab
d-i partman-auto/expert_recipe_file string /tmp/axonwall-ab-recipe
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Package Selection & Base Firewall Services
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string \
  curl \
  wget \
  ca-certificates \
  gnupg \
  nftables \
  iproute2 \
  ethtool \
  pciutils \
  tcpdump \
  conntrack \
  conntrackd \
  keepalived \
  wireguard-tools \
  suricata \
  kea-dhcp4-server \
  unbound \
  frr \
  strongswan \
  openvpn \
  jq \
  nodejs \
  net-tools \
  openssl \
  rsync \
  python3 \
  mdadm \
  gdisk \
  parted \
  smartmontools \
  cloud-init \
  cloud-guest-utils \
  cryptsetup \
  systemd-cryptsetup \
  tpm2-tools \
  xfsprogs \
  samba \
  nfs-kernel-server \
  open-iscsi \
  zsh \
  zsh-autosuggestions \
  zsh-syntax-highlighting \
  starship \
  zoxide \
  vim \
  tmux \
  fzf \
  ripgrep \
  fd-find \
  bat \
  mtr-tiny \
  btop \
  htop \
  sysstat \
  iotop \
  iftop \
  slurm \
  dnsutils \
  nmap

d-i pkgsel/upgrade select none

# Boot Loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/force-efi-extra-removable boolean true

# Early Cloud-Init seed detection (runs during file-preseed before netcfg & user-setup)
d-i preseed/include_command string sh /usr/lib/axonwall/detect-cloudinit --print-preseed

# Early preseed hook: load Axonwall debconf templates
d-i preseed/early_command string \
  chmod 755 /usr/lib/axonwall/* 2>/dev/null || true; \
  if [ -f /usr/lib/axonwall/axonwall.templates ]; then \
    debconf-loadtemplate user-setup /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    debconf-loadtemplate passwd /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    debconf-loadtemplate partman /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    debconf-loadtemplate axonwall /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
  fi

# Partman early hook: install interactive target disk selection handler
d-i partman/early_command string \
  if [ -f /usr/lib/axonwall/10initial_auto ]; then \
    cp /usr/lib/axonwall/10initial_auto /usr/lib/partman/display.d/10initial_auto 2>/dev/null || true; \
    cp /usr/lib/axonwall/10initial_auto /lib/partman/display.d/10initial_auto 2>/dev/null || true; \
    chmod 755 /usr/lib/partman/display.d/10initial_auto /lib/partman/display.d/10initial_auto 2>/dev/null || true; \
  fi; \
  if [ -f /usr/lib/axonwall/axonwall.templates ]; then \
    debconf-loadtemplate user-setup /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    debconf-loadtemplate passwd /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    debconf-loadtemplate partman /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
    debconf-loadtemplate axonwall /usr/lib/axonwall/axonwall.templates 2>/dev/null || true; \
  fi

# Post-Installation Hook: Enable Services & Launch Axonwall Setup
# The bundled network daemons (suricata/kea/unbound/frr/strongswan/openvpn/
# conntrackd/keepalived) are started by axonwalld from compiled config on
# ApplyBundle; the disable in late_command stops Debian's maintainer scripts
# from auto-enabling them with distro default configs at first boot (S-02).
d-i preseed/late_command string \
  chmod +x /usr/lib/finish-install.d/* 2>/dev/null || true; \
  in-target systemctl enable axonwalld axonwall-firstboot axonwall-controller axonwall-ui headscale nftables ssh cloud-init-local cloud-init cloud-config cloud-final; \
  in-target systemctl disable suricata kea-dhcp4-server unbound frr strongswan openvpn conntrackd keepalived || true; \
  in-target chsh -s /usr/bin/zsh root || true; \
  in-target mkdir -p /etc/axonwall /etc/ssh/sshd_config.d; \
  in-target touch /etc/axonwall/.firstboot; \
  echo "PermitRootLogin prohibit-password" > /target/etc/ssh/sshd_config.d/axonwall.conf; \
  echo "PasswordAuthentication no" >> /target/etc/ssh/sshd_config.d/axonwall.conf; \
  echo "AuthenticationMethods publickey" >> /target/etc/ssh/sshd_config.d/axonwall.conf;

# Finish installation and reboot
d-i finish-install/reboot_in_progress note
