menuentry "Install Axonwall OS via Serial Console (ttyS0 115200)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ axonwall_install=1 console=ttyS0,115200n8
	initrd	@INITRD_LIVE@
}
menuentry "Legacy Debian Installer (d-i Preseed Dark Theme)" --hotkey=d {
	linux	@KERNEL_DI@ vga=788 theme=dark @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}
menuentry "Legacy Debian Installer (Expert Mode)" --hotkey=x {
	linux	@KERNEL_DI@ priority=low vga=788 theme=dark @APPEND_INSTALL@
	initrd	@INITRD_DI@
}
menuentry "Legacy Rescue Mode" --hotkey=r {
	linux	@KERNEL_DI@ rescue/enable=true vga=788 theme=dark @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_DI@
}
