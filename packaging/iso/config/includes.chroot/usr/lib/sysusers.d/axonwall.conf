# Systemd sysusers configuration for Axonwall network appliance
# Type Name ID GECOS Home Shell
g axonwall-api - -
u axonwall - "Axonwall System User" /var/lib/axonwall /usr/sbin/nologin
u axonwall-controller - "Axonwall Controller Service User" /var/lib/axonwall /usr/sbin/nologin
u axonwall-headscale - "Axonwall Headscale Service User" /var/lib/axonwall /usr/sbin/nologin
m axonwall axonwall-api
m axonwall-controller axonwall-api
