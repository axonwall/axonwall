# Systemd tmpfiles configuration for Axonwall network appliance
# Type Path Mode User Group Age Argument
# NOTE: /var/lib/axonwall/secrets{,/ldap,/ha-pki} are managed by postinst and
# axonwall-firstboot (0700 root:root when standalone, 0750 root:openldap when
# OpenLDAP HA PKI is active) and must not be reset on boot by tmpfiles.
d /var/lib/axonwall 3775 root axonwall-api - -
d /var/lib/axonwall/etc-axonwall 3770 axonwall axonwall-api - -
d /var/lib/axonwall/gitops 3770 axonwall axonwall-api - -
d /var/lib/axonwall/captures 3770 axonwall axonwall-api - -
d /var/lib/axonwall/backups 3770 axonwall axonwall-api - -
d /var/lib/axonwall/home 0755 root root - -
d /var/log/axonwall 1770 root axonwall-api - -
d /var/cache/axonwall-ui 0750 axonwall axonwall - -
d /run/axonwall 0770 root axonwall-api - -
d /etc/axonwall 1770 root axonwall-api - -
d /etc/axonwall/certs 0750 root axonwall-api - -
d /opt/axonwall 0755 root root - -
d /var/lib/axonwall/headscale 0700 axonwall-headscale axonwall-headscale - -
d /run/headscale 0770 axonwall-headscale axonwall-headscale - -
z /etc/headscale/config.yaml 0640 root axonwall-headscale - -
