# Systemd tmpfiles configuration for Axonwall network appliance
# Type Path Mode User Group Age Argument
d /var/lib/axonwall 1775 root axonwall-api - -
d /var/lib/axonwall/home 0755 root root - -
d /var/lib/axonwall/secrets 0700 root root - -
d /var/lib/axonwall/secrets/ldap 0700 root root - -
d /var/lib/axonwall/secrets/ha-pki 0700 root root - -
d /var/log/axonwall 0750 axonwall axonwall - -
d /var/cache/axonwall-ui 0750 axonwall axonwall - -
d /run/axonwall 0770 root axonwall-api - -
d /etc/axonwall 1770 root axonwall-api - -
d /etc/axonwall/certs 0750 root axonwall-api - -
d /opt/axonwall 0755 root root - -
d /var/lib/axonwall/headscale 0770 axonwall-headscale axonwall-headscale - -
d /run/headscale 0770 axonwall-headscale axonwall-api - -
z /etc/headscale/config.yaml 0640 root axonwall-api - -
