# Suppress systemd unit start/failure broadcasts and stdout/stderr forwarding
# onto /dev/console (/dev/tty1) so background service transitions (e.g. cloud-init,
# unbound, networking) never overwrite the Axonwall Installer or Appliance Console TUI.
# All service output and errors remain in journald and are captured in the
# Installer Logs & Diagnostics screen ([V]).
[Manager]
ShowStatus=no
LogTarget=journal
LogColor=no
DefaultStandardOutput=journal
DefaultStandardError=journal
