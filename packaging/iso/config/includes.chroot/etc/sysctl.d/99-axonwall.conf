# Axonwall Kernel Tuning for High-Throughput Packet Forwarding & Low Latency

# Enable IPv4 & IPv6 packet forwarding
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv6.conf.all.forwarding = 1

# Disable IP source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Enable loose reverse path filtering (spoof protection compatible with Multi-WAN, WireGuard mesh, and K3s CNI overlays)
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Ignore ICMP broadcast requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Socket buffer & backlog sizing for 10GbE+ line-rate
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 250000
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# Connection Tracking (conntrack) sizing
net.netfilter.nf_conntrack_max = 2097152
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15

# BBR Congestion Control
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

# TCP Fast Open
net.ipv4.tcp_fastopen = 3

# Ghost-in-the-Ring Kernel Rootkit & io_uring Hardening
# 1 = Restrict io_uring creation to io_uring_group GID (mitigates Curing / RingReaper / CVE-2023-2598)
kernel.io_uring_disabled = 1
kernel.io_uring_group = 994
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 2
