# ==============================================================================
# Axonwall Hardened SSH Configuration (Keys Only)
# NOTE: SSSD AuthorizedKeysCommand is provisioned separately when LDAP/SSSD is configured.
# ==============================================================================
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
UsePAM yes
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
MaxAuthTries 3

Match Group axonwall-operator
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitOpen none
    PermitTTY yes
    ForceCommand /usr/local/bin/axonwall-opshell
