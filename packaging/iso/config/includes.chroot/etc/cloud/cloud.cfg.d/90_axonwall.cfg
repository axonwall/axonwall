# ==============================================================================
# Axonwall Appliance Cloud-Init Datasource Configuration
# ==============================================================================
# Configures datasource priority for Axonwall appliances across bare-metal,
# Proxmox VE, OpenStack, KVM/QEMU, AWS, GCP, and Azure environments.

datasource_list: [ NoCloud, ConfigDrive, OpenStack, OVF, Ec2, GCE, Azure, None ]

datasource:
  NoCloud:
    fs_label: cidata
  ConfigDrive:
    dsmode: local

system_info:
  default_user:
    shell: /usr/bin/zsh

# Capture all cloud-init output into /var/log/cloud-init-output.log and
# /var/log/axonwall-console-capture.log instead of writing raw stdout/stderr
# directly onto /dev/console (/dev/tty1) where the Axonwall TUI runs.
output:
  all: "| tee -a /var/log/cloud-init-output.log /var/log/axonwall-console-capture.log >/dev/null"


