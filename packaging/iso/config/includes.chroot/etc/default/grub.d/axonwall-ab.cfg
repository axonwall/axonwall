# Axonwall GRUB defaults for A/B Dual-Root Partitioning
GRUB_DEFAULT="0"
GRUB_TIMEOUT="3"
GRUB_RECORDFAIL_TIMEOUT="3"
GRUB_DISABLE_OS_PROBER="true"
GRUB_TERMINAL_INPUT="console serial"
GRUB_TERMINAL_OUTPUT="gfxterm serial"
GRUB_SERIAL_COMMAND="serial --unit=0 --speed=9600 --word=8 --parity=no --stop=1"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash plymouth.ignore-serial-consoles net.ifnames=0 lsm=landlock,lockdown,yama,integrity,apparmor,bpf console=ttyS0,9600 console=tty0"
