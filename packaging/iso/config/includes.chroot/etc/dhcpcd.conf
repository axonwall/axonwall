# Axonwall dhcpcd configuration
# Managed by Axonwall

hostname
clientid
persistent
vendorclassid

option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name
option ntp_servers

require dhcp_server_identifier
slaac private

# Disable IPv4LL / APIPA fallback (prevents bogus 169.254.x.x addresses on link delays)
noipv4ll
