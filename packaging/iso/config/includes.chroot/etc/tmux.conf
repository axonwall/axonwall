# ==============================================================================
# Axonwall Appliance Modern tmux Configuration (/etc/tmux.conf)
# ==============================================================================

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-shell /usr/bin/zsh
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10

# Intuitive pane splitting with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Axonwall Cyber-Emerald Status Bar
set -g status-interval 5
set -g status-style "bg=#0f172a,fg=#e2e8f0"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#0f172a,bg=#10b981,bold] AXONWALL #[fg=#38bdf8,bg=#1e293b] #H #[default] "
set -g status-right "#[fg=#94a3b8]Load: #(cut -d' ' -f1-3 /proc/loadavg) #[fg=#38bdf8]| #[fg=#f8fafc,bold]%Y-%m-%d %H:%M:%S UTC "
setw -g window-status-current-format "#[fg=#10b981,bg=#1e293b,bold] #I:#W* "
setw -g window-status-format "#[fg=#94a3b8] #I:#W "
