Global:
  ManageImages: true
  BootMountPoint: /boot/efi
  DracutConfDir: /etc/zfsbootmenu/dracut.conf.d
Components:
  ImageDir: /boot/efi/EFI/ZBM
  Versions: 2
  Enabled: true
EFI:
  ImageDir: /boot/efi/EFI/ZBM
  Versions: 2
  Enabled: true
  SplashImage: /etc/zfsbootmenu/splash.bmp
Kernel:
  CommandLine: "ro quiet loglevel=3 net.ifnames=0 zbm.timeout=5 zbm.autosize=1 zbm.hookroot=LABEL=AXON_EFI//EFI/ZBM/hooks console=ttyS0,115200 console=tty1"
