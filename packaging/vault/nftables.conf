#!/usr/sbin/nft -f
# Axonwall Vault Edition -- static firewall ruleset.
#
# The vault serves exactly one thing to the network: the SeaweedFS S3
# endpoint on TCP 8333 (TLS). SSH stays available for administration.
# Everything else is dropped -- in particular the SeaweedFS master
# (9333), volume (8080), filer (8888/18888) and auxiliary (8181/9101)
# listeners, which are the store's root-equivalent admin domain and
# must never be reachable by backup clients (Phase 0 finding: the
# filer path bypasses S3 Object Lock entirely).
flush ruleset

table inet vault_filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
        tcp dport 22 accept
        tcp dport 8333 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
