# Axonwall ZFSBootMenu Dracut Theme & Color Configuration
# /etc/zfsbootmenu/dracut.conf.d/colors.conf

# Direct Dracut to bundle user hooks from /etc/zfsbootmenu/hooks
zfsbootmenu_hook_root="/etc/zfsbootmenu/hooks"

# Ensure Terminus bold fonts are included in the initramfs
install_items+=" /usr/share/zfsbootmenu/fonts/* /etc/zfsbootmenu/splash.bmp "
