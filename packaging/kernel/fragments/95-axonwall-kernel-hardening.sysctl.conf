# ==============================================================================
# Axonwall Hardened Kernel Runtime Sysctl Profile (95)
# Hardens memory/BPF/filesystem exposure while keeping K3s, rootless containers,
# OpenZFS, WireGuard, and eBPF CO-RE telemetry operational.
# Optional distro/kernel-specific keys use leading `-` so systemd-sysctl ignores
# unavailable sysctls without failing boot.
# ==============================================================================

# Allow rootless Podman / containerd / K3s user namespaces (guarded by AppArmor & BPF-LSM)
-kernel.unprivileged_userns_clone = 1

# Restrict unprivileged BPF, userfaultfd, ptrace, and dmesg/kptr leaks
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
-kernel.perf_event_paranoid = 2
-vm.unprivileged_userfaultfd = 0
-dev.tty.ldisc_autoload = 0
kernel.yama.ptrace_scope = 1

# Restrict io_uring to io_uring_group when kernel supports io_uring_disabled
-kernel.io_uring_disabled = 1

# Filesystem & core dump hardening
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.suid_dumpable = 0

# Network SYN & TIME-WAIT assassination hardening
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
