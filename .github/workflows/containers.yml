name: Build and Publish Container Images & Helm Chart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containers:
    name: Build & Push ${{ matrix.component }} (amd64/arm64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: axonwalld
            dockerfile: deploy/docker/Dockerfile.axonwalld
          - component: axonwall-ui
            dockerfile: deploy/docker/Dockerfile.ui
          - component: axonwall-controller
            dockerfile: deploy/docker/Dockerfile.controller
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  helm-charts:
    name: Package & Push Helm Charts (OCI)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Lint and template Axonwall Helm charts
        run: |
          helm lint deploy/k8s/helm/axonwall
          helm template test-axonwall deploy/k8s/helm/axonwall >/dev/null
          helm lint deploy/k8s/helm/axonwall-analytics
          helm template test-homelab deploy/k8s/helm/axonwall-analytics -f deploy/k8s/helm/axonwall-analytics/values-homelab.yaml >/dev/null
          helm template test-standard deploy/k8s/helm/axonwall-analytics -f deploy/k8s/helm/axonwall-analytics/values-standard.yaml >/dev/null
          helm template test-enterprise deploy/k8s/helm/axonwall-analytics -f deploy/k8s/helm/axonwall-analytics/values-enterprise.yaml >/dev/null

      - name: Login and push Helm charts to GHCR OCI
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          HELM_REGISTRY_USER: ${{ github.actor }}
          HELM_REGISTRY_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          HELM_DIST="$(mktemp -d)"
          trap 'rm -rf "${HELM_DIST}"' EXIT
          OWNER_LOWER="${REPO_OWNER,,}"
          printf '%s\n' "${HELM_REGISTRY_TOKEN}" | helm registry login ghcr.io --username "${HELM_REGISTRY_USER}" --password-stdin
          helm package deploy/k8s/helm/axonwall --destination "${HELM_DIST}"
          helm package deploy/k8s/helm/axonwall-analytics --destination "${HELM_DIST}"
          for pkg in "${HELM_DIST}"/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${OWNER_LOWER}/charts"
          done
