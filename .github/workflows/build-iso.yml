name: Build Axonwall Appliance ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Debian 13 Appliance ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: 'apps/**/*.sum'

      - name: Build Axonwall Monorepo Artifacts
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compile Axonwalld Core Daemon
        run: |
          cd apps/axonwalld
          go build -ldflags="-s -w" -o bin/axonwalld main.go

      - name: Cross-Compile Satellite Binaries
        run: |
          cd apps/axonwall-satellite
          make all

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial
          sudo apt-get update -y || { sleep 10; sudo apt-get update -y; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o APT::Immediate-Configure=false \
            -o Dpkg::Pre-Install-Pkgs='echo "Skipping pre-install"' \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools || sudo apt-get install -fy
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o APT::Immediate-Configure=false live-build; then
            echo "live-build not in runner package index, fetching official Debian package..."
            curl -fsSL -o /tmp/live-build.deb http://deb.debian.org/debian/pool/main/l/live-build/live-build_20250814_all.deb || \
            curl -fsSL -o /tmp/live-build.deb http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb
            sudo dpkg -i /tmp/live-build.deb || sudo apt-get install -fy
            rm -f /tmp/live-build.deb
          fi

      - name: Build Hybrid Appliance ISO
        run: |
          sudo ./packaging/iso/build-iso.sh

      - name: Compute Checksums
        run: |
          cd packaging/iso/output
          sha256sum axonwall-debian13-amd64.iso > axonwall-debian13-amd64.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axonwall-debian13-amd64-iso
          path: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
          retention-days: 14

      - name: Release ISO (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
