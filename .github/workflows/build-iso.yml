name: Build Axonwall Appliance ISOs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Default token is read-only; the single build job below re-grants
# contents: write, which only its two release-publish steps need.
# (Splitting the release steps into their own job so the build itself
# runs read-only is the remaining step -- audit finding C6.)
permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian 13 & Alpine Linux Appliance ISOs
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    # Least privilege: the ~25-minute build only reads the repo and
    # uploads artifacts. Publishing releases (the only step needing
    # contents: write) lives in the separate `release` job below (C6).
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Compute pnpm lock hash
        id: pnpm-lock-hash
        shell: bash
        run: |
          set -euo pipefail

          # Look for any pnpm lockfiles (root and subdirectories)
          if ! git ls-files 'pnpm-lock.yaml' '**/pnpm-lock.yaml' | grep -q .; then
            # No lockfiles found — use stable sentinel to keep cache key stable
            echo "hash=nopnpmlock" >> "$GITHUB_OUTPUT"
          else
            # Compute deterministic combined sha256 of all lock files
            sha=$(git ls-files -z 'pnpm-lock.yaml' '**/pnpm-lock.yaml' | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
            echo "hash=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules/.pnpm
          key: ${{ runner.os }}-pnpm-${{ steps.pnpm-lock-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript/TypeScript tests
        run: pnpm --if-present test

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.x'
          cache: 'true'
          cache-dependency-path: |
            go.sum
            apps/**/go.sum

      - name: Ensure Go toolchain can auto-resolve newer versions
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Verify Go
        run: go version

      - name: Run Go tests
        run: |
          set -e
          if [ -d apps/axonwalld ]; then
            cd apps/axonwalld
            CGO_ENABLED=0 go test ./... -v
            cd - >/dev/null
          fi
          if [ -d apps/axonwall-console ]; then
            cd apps/axonwall-console
            CGO_ENABLED=0 go test ./... -v
            cd - >/dev/null
          fi
          if [ -d apps/axonwall-satellite ]; then
            cd apps/axonwall-satellite
            CGO_ENABLED=0 go test ./... -v
            cd - >/dev/null
          fi

      - name: Build Axonwall Artifacts
        run: |
          pnpm build

      - name: Compile Axonwalld Core Daemon
        run: |
          cd apps/axonwalld
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/axonwalld .

      - name: Compile Axonwall Console TUI
        run: |
          cd apps/axonwall-console
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/axonwall-console .

      - name: Cross-Compile Satellite Binaries
        run: |
          cd apps/axonwall-satellite
          make all

      - name: Install ISO Build Dependencies
        shell: bash
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial

          # Retry update up to 5 times with exponential backoff
          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt..."
            if sudo apt-get update -y; then
              echo "Update successful"
              break
            fi
            if [ $attempt -lt 5 ]; then
              echo "Update attempt $attempt failed, retrying..."
              sudo rm -rf /var/lib/apt/lists/*
              sudo mkdir -p /var/lib/apt/lists/partial
              sleep $((attempt * 15))
            else
              echo "All update attempts failed"
              exit 1
            fi
          done

          # Install basic dependencies first (including Linux kernel UKI build deps)
          pkgs=(
            bc
            bison
            cpio
            flex
            libelf-dev
            libssl-dev
            xz-utils
            debootstrap
            debian-archive-keyring
            xorriso
            isolinux
            syslinux-efi
            syslinux-common
            grub-pc-bin
            grub-efi-amd64-bin
            dosfstools
            mtools
            qemu-utils
          )
          for attempt in 1 2 3; do
            echo "apt-get install attempt $attempt..."
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -o APT::Immediate-Configure=false \
              -o Dpkg::Pre-Install-Pkgs='echo "Skipping pre-install"' \
              "${pkgs[@]}"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -fy --fix-broken || true
              sudo apt-get update -y || true
              sleep $((attempt * 10))
            else
              echo "Failed to install ISO build dependencies after 3 attempts" >&2
              exit 1
            fi
          done

          # Download and install live-build directly. HTTPS + a pinned
          # SHA-256 (cross-checked against the hash published for
          # 1:20250814 in Debian sid's signed Packages index, 2026-10-16):
          # this .deb is installed as root in the release pipeline.
          curl -fsSL -o /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250814_all.deb
          echo "a4bffb8e6436ffba260f2e1c37be9dd04a4dacf52c38d7bbe454ec826ba52a4b  /tmp/live-build.deb" | sha256sum -c -
          sudo dpkg -i /tmp/live-build.deb
          rm -f /tmp/live-build.deb

      - name: Build Super-Slim Edge NGFW UKI (sku-vm-virtio)
        run: |
          ./packaging/edge-uki/build-edge-uki.sh --sku sku-vm-virtio --mode full-uki

      - name: Build Debian (.deb) Packages
        run: |
          # D-M9: one package per edition. The flavor packages carry
          # the edition's own payload (no NGFW daemon/UI/controller)
          # so a flavor update never reintroduces the stripped
          # payload. The sign/upload/size-guard/release steps below
          # are glob-based and pick up all three automatically.
          ./packaging/debian/build-deb.sh --edition axonwall
          ./packaging/debian/build-deb.sh --edition vault
          ./packaging/debian/build-deb.sh --edition k3s-storage

      - name: Sign Debian Package Checksum (if signing key configured)
        env:
          AXONWALL_RELEASE_SIGNING_KEY: ${{ secrets.AXONWALL_RELEASE_SIGNING_KEY }}
        if: env.AXONWALL_RELEASE_SIGNING_KEY != ''
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$AXONWALL_RELEASE_SIGNING_KEY" > "$key_file"
          for sha in packaging/debian/output/*.deb.sha256; do
            openssl dgst -sha256 -sign "$key_file" -out "${sha}.sig" "$sha"
          done

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-debian-package
          path: |
            packaging/debian/output/*.deb
            packaging/debian/output/*.deb.sha256
            packaging/debian/output/*.deb.sha256.sig
          retention-days: 7

      - name: Check preseeds agree (D-M8, D-L4)
        run: |
          # The d-i installer preseed (preseed-vault.cfg, used for
          # config/includes.installer/preseed.cfg) and the live-image
          # preseed (preseed-vault-binary.cfg, used for
          # config/includes.binary/preseed.cfg) drifted apart before:
          # the binary image lost the disk-tooling packages and the
          # cloud-init services. Compare the package lists and the
          # enabled-service lists, not whole files -- the files
          # differ legitimately elsewhere.
          # R4-D-L4: the NGFW pair (includes.installer/preseed.cfg vs
          # includes.binary/preseed.cfg) was never compared. It is now,
          # with the same extractors. Package lists are sorted before
          # comparing, so the known sqlite3 ordering drift between the
          # two NGFW files does not fail the check; a real drift does.
          extract_pkgs() {
            awk '/d-i pkgsel\/include string/{flag=1; next} flag{print; if ($0 !~ /\\$/) exit}' "$1" \
              | sed 's/\\$//; s/^[[:space:]]*//; s/[[:space:]]*$//' | sort
          }
          extract_services() {
            grep 'systemctl enable' "$1" | sed 's/.*systemctl enable//; s/;.*//' \
              | tr ' ' '\n' | grep -v '^$' | sort
          }
          fail=0
          if ! diff -u <(extract_pkgs packaging/vault/preseed-vault.cfg) <(extract_pkgs packaging/vault/preseed-vault-binary.cfg); then
            echo "::error::vault preseed package lists differ"
            fail=1
          fi
          if ! diff -u <(extract_services packaging/vault/preseed-vault.cfg) <(extract_services packaging/vault/preseed-vault-binary.cfg); then
            echo "::error::vault preseed enabled-service lists differ"
            fail=1
          fi
          if ! diff -u <(extract_pkgs packaging/k3s-storage/preseed-k3s-storage.cfg) <(extract_pkgs packaging/k3s-storage/preseed-k3s-storage-binary.cfg); then
            echo "::error::k3s-storage preseed package lists differ"
            fail=1
          fi
          if ! diff -u <(extract_services packaging/k3s-storage/preseed-k3s-storage.cfg) <(extract_services packaging/k3s-storage/preseed-k3s-storage-binary.cfg); then
            echo "::error::k3s-storage preseed enabled-service lists differ"
            fail=1
          fi
          if ! diff -u <(extract_pkgs packaging/iso/config/includes.installer/preseed.cfg) <(extract_pkgs packaging/iso/config/includes.binary/preseed.cfg); then
            echo "::error::NGFW preseed package lists differ"
            fail=1
          fi
          if ! diff -u <(extract_services packaging/iso/config/includes.installer/preseed.cfg) <(extract_services packaging/iso/config/includes.binary/preseed.cfg); then
            echo "::error::NGFW preseed enabled-service lists differ"
            fail=1
          fi
          if ! diff -u packaging/iso/config/includes.chroot/usr/local/bin/axonwall-install packaging/alpine/overlay/usr/local/bin/axonwall-install; then
            echo "::error::axonwall-install differs between Debian ISO and Alpine ISO overlays"
            fail=1
          fi
          for s in \
            packaging/iso/config/includes.chroot/usr/local/bin/axonwall-install \
            packaging/iso/config/includes.chroot/usr/local/bin/axonwall-update \
            packaging/iso/config/includes.chroot/usr/local/bin/axonwallctl \
            packaging/k3s-storage/axonwall-k3s-firstboot \
            packaging/k3s-storage/axonwall-k3s-verify \
            packaging/vault/axonwall-vault-firstboot \
            packaging/vault/axonwall-vault-provision \
            packaging/vault/axonwall-vault-status \
            packaging/debian/postinst \
            packaging/alpine/overlay/usr/local/bin/axonwall-firstboot-alpine; do
            if ! sh -n "$s"; then
              echo "::error::POSIX sh syntax check failed for $s"
              fail=1
            fi
          done
          for b in \
            packaging/cloud-image/build-qcow2.sh \
            packaging/debian/build-deb.sh \
            packaging/iso/build-iso.sh \
            packaging/alpine/build-alpine-iso.sh \
            packaging/iso/config/includes.chroot/usr/local/bin/axonwall-cloud-init; do
            if ! bash -n "$b"; then
              echo "::error::bash syntax check failed for $b"
              fail=1
            fi
          done
          exit $fail

      - name: Build Hybrid Appliance ISO (Unified NGFW, Vault & K3s Storage Editions)
        run: |
          sudo ./packaging/iso/build-iso.sh

      - name: Build Alpine Linux Appliance ISO
        # R4-D-M4: the job is named "Build Debian 13 & Alpine Linux
        # Appliance ISOs" but no step used to build the Alpine ISO at
        # all -- the Alpine surface shipped with syntax-check-only
        # verification. This step runs the real builder
        # (packaging/alpine/build-alpine-iso.sh, default profile virt,
        # minimal). On a non-Alpine host the builder delegates to an
        # alpine:3.21 Docker container, which the ubuntu-24.04 runner
        # provides, so the real build runs in CI -- not a smoke check.
        # The builder verifies the pinned base-ISO SHA-256 and fails
        # closed on any step, so a successful step means a real ISO was
        # produced; the artifact-existence check below is the backstop.
        run: |
          ./packaging/alpine/build-alpine-iso.sh
          found=0
          for iso in packaging/alpine/output/*.iso; do
            [ -e "$iso" ] || continue
            found=1
            echo "Alpine ISO $iso: $(stat -c%s "$iso") bytes"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No Alpine ISO produced in packaging/alpine/output/ -- the Alpine build produced nothing."
            exit 1
          fi

      - name: Build Cloud Appliance Image (QCOW2)
        run: |
          sudo ./packaging/cloud-image/build-qcow2.sh

      - name: Enforce Cloud Image Size Limit (D2-L2)
        run: |
          # GitHub releases reject assets over 2 GiB (2,147,483,648
          # bytes). PR #115 brought the qcow2 back to ~1.17 GiB by
          # shipping slot B empty; fail fast here if a future change
          # regrows it, instead of surfacing as a confusing
          # action-gh-release upload error in the release job. The
          # 1.9 GiB threshold leaves headroom under the hard cap.
          max_bytes=$((19 * 1024 * 1024 * 1024 / 10))
          fail=0
          found=0
          for qcow2 in packaging/cloud-image/output/*.qcow2; do
            [ -e "$qcow2" ] || continue
            found=1
            size=$(stat -c%s "$qcow2")
            echo "Cloud image $qcow2: $size bytes (limit $max_bytes)"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::Cloud image $qcow2 is $size bytes, over the $max_bytes byte (1.9 GiB) limit — GitHub releases reject assets over 2 GiB."
              fail=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No qcow2 artifact found in packaging/cloud-image/output/ — the cloud image build produced nothing."
            fail=1
          fi
          exit $fail

      - name: Enforce Release Asset Size Limits (E-L3)
        run: |
          # GitHub releases reject assets over 2 GiB (2,147,483,648
          # bytes). The qcow2 got a fail-fast check after it actually
          # exceeded the limit (PR #115, D2-L2); the ISO — the largest
          # remaining asset — had none, so a future regrowth would fail
          # only at release upload, after the ~25-minute build. Same
          # 1.9 GiB threshold leaves headroom under the hard cap. The
          # .deb and UKI are checked when present (they are far smaller
          # and unlikely to trip it, but the check is free).
          max_bytes=$((19 * 1024 * 1024 * 1024 / 10))
          fail=0
          found_iso=0
          for iso in packaging/iso/output/*.iso; do
            [ -e "$iso" ] || continue
            found_iso=1
            size=$(stat -c%s "$iso")
            echo "ISO $iso: $size bytes (limit $max_bytes)"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::ISO $iso is $size bytes, over the $max_bytes byte (1.9 GiB) limit — GitHub releases reject assets over 2 GiB."
              fail=1
            fi
          done
          if [ "$found_iso" -eq 0 ]; then
            echo "::error::No ISO artifact found in packaging/iso/output/ — the ISO build produced nothing."
            fail=1
          fi
          for asset in packaging/debian/output/*.deb packaging/edge-uki/output/*.efi; do
            [ -e "$asset" ] || continue
            size=$(stat -c%s "$asset")
            echo "Asset $asset: $size bytes (limit $max_bytes)"
            if [ "$size" -gt "$max_bytes" ]; then
              echo "::error::Release asset $asset is $size bytes, over the $max_bytes byte (1.9 GiB) limit — GitHub releases reject assets over 2 GiB."
              fail=1
            fi
          done
          exit $fail

      - name: Compute Checksums
        run: |
          sudo bash -c 'cd packaging/iso/output && sha256sum axonwall-debian13-amd64.iso > axonwall-debian13-amd64.iso.sha256 && chmod 644 axonwall-debian13-amd64.iso.sha256'
          sudo bash -c 'if [ -d packaging/cloud-image/output ]; then cd packaging/cloud-image/output && sha256sum axonwall-debian13-amd64-cloud.qcow2 > axonwall-debian13-amd64-cloud.qcow2.sha256 && chmod 644 axonwall-debian13-amd64-cloud.qcow2.sha256; fi'
          sudo chown -R $USER:$USER packaging/iso/output packaging/debian/output packaging/cloud-image/output packaging/edge-uki/output packaging/alpine/output 2>/dev/null || true

      - name: Sign ISO, Cloud Image & Edge UKI Checksums (if signing key configured)
        env:
          AXONWALL_RELEASE_SIGNING_KEY: ${{ secrets.AXONWALL_RELEASE_SIGNING_KEY }}
        if: env.AXONWALL_RELEASE_SIGNING_KEY != ''
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$AXONWALL_RELEASE_SIGNING_KEY" > "$key_file"
          for sha in packaging/iso/output/*.iso.sha256 packaging/cloud-image/output/*.qcow2.sha256 packaging/edge-uki/output/*.sha256; do
            if [ -f "$sha" ]; then
              openssl dgst -sha256 -sign "$key_file" -out "${sha}.sig" "$sha"
            fi
          done

      - name: Upload Super-Slim Edge NGFW UKI Artifact (release handoff)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-edge-uki
          path: |
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256.sig
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256.sig
          retention-days: 7

      - name: Upload ISO Checksum Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-debian13-amd64-checksum
          path: packaging/iso/output/axonwall-debian13-amd64.iso.sha256
          retention-days: 1

      - name: Upload Debian ISO Artifact (release handoff)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-debian-iso
          path: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256.sig
          retention-days: 1

      - name: Upload Alpine ISO Artifact (release handoff)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-alpine-iso
          path: |
            packaging/alpine/output/*.iso
            packaging/alpine/output/*.iso.sha256
          retention-days: 1

      - name: Upload Cloud Appliance QCOW2 Artifact (release handoff)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-cloud-qcow2
          path: |
            packaging/cloud-image/output/*.qcow2
            packaging/cloud-image/output/*.qcow2.sha256
            packaging/cloud-image/output/*.qcow2.sha256.sig
          retention-days: 1


  release:
    name: Publish Release Artifacts
    needs: build-iso
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Debian Package Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-debian-package
          path: packaging/debian/output

      - name: Download Super-Slim Edge NGFW UKI Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-edge-uki
          path: packaging/edge-uki/output

      - name: Download Debian ISO Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-debian-iso
          path: packaging/iso/output

      - name: Download Cloud Appliance QCOW2 Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-cloud-qcow2
          path: packaging/cloud-image/output

      - name: Stage & Verify Mandatory Release Artifacts
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          for req in \
            packaging/iso/output/axonwall-debian13-amd64.iso \
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256 \
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi \
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256 \
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz \
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256; do
            test -s "$req" || { echo "::error::Missing required release artifact: $req"; exit 1; }
            cp -v "$req" release-assets/
          done
          for glob_dir_pat in \
            "packaging/cloud-image/output/*.qcow2" \
            "packaging/cloud-image/output/*.qcow2.sha256" \
            "packaging/debian/output/*.deb" \
            "packaging/debian/output/*.deb.sha256"; do
            matched=0
            for f in $glob_dir_pat; do
              if [ -s "$f" ]; then
                matched=1
                cp -v "$f" release-assets/
              fi
            done
            if [ "$matched" -eq 0 ]; then
              echo "::error::Missing required release artifact matching: $glob_dir_pat"
              exit 1
            fi
          done
          for sig in \
            packaging/debian/output/*.deb.sha256.sig \
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256.sig \
            packaging/cloud-image/output/*.qcow2.sha256.sig \
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256.sig \
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256.sig; do
            if [ -s "$sig" ]; then
              cp -v "$sig" release-assets/
            fi
          done

      - name: Release Distribution Artifacts (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/*

      - name: Publish Rolling Latest Pre-Release (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          tag_name: rolling-latest
          name: "Axonwall Appliance ISO, Cloud QCOW2, Edge UKI & Debian Package (Rolling Latest)"
          body: |
            ### Automated Continuous Build
            - **Commit**: ${{ github.sha }}
            - **Branch**: `main`
            - **Distribution**:
              - Debian 13 (Trixie) amd64 (Unified Hybrid ISO for NGFW, Vault & K3s Storage Editions + Cloud QCOW2 + .deb Package)
              - Super-Slim Edge NGFW UEFI Unified Kernel Image (`sku-vm-virtio` default virtual appliance)
            - **Artifacts**:
