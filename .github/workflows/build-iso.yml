name: Build Axonwall Appliance ISOs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Default token is read-only; the single build job below re-grants
# contents: write, which only its two release-publish steps need.
# (Splitting the release steps into their own job so the build itself
# runs read-only is the remaining step -- audit finding C6.)
permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian 13 & Alpine Linux Appliance ISOs
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    # Least privilege: the ~25-minute build only reads the repo and
    # uploads artifacts. Publishing releases (the only step needing
    # contents: write) lives in the separate `release` job below (C6).
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Compute pnpm lock hash
        id: pnpm-lock-hash
        shell: bash
        run: |
          set -euo pipefail

          # Look for any pnpm lockfiles (root and subdirectories)
          if ! git ls-files 'pnpm-lock.yaml' '**/pnpm-lock.yaml' | grep -q .; then
            # No lockfiles found — use stable sentinel to keep cache key stable
            echo "hash=nopnpmlock" >> "$GITHUB_OUTPUT"
          else
            # Compute deterministic combined sha256 of all lock files
            sha=$(git ls-files -z 'pnpm-lock.yaml' '**/pnpm-lock.yaml' | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
            echo "hash=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: |
            ~/.pnpm-store
            node_modules/.pnpm
          key: ${{ runner.os }}-pnpm-${{ steps.pnpm-lock-hash.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Run JavaScript/TypeScript tests
        run: pnpm --if-present test

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: 'true'
          cache-dependency-path: |
            go.sum
            apps/**/go.sum

      - name: Ensure Go toolchain can auto-resolve newer versions
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

      - name: Verify Go
        run: go version

      - name: Run Go tests
        run: |
          set -e
          if [ -d apps/axonwalld ]; then
            cd apps/axonwalld
            CGO_ENABLED=0 go test ./... -v
            cd - >/dev/null
          fi
          if [ -d apps/axonwall-console ]; then
            cd apps/axonwall-console
            CGO_ENABLED=0 go test ./... -v
            cd - >/dev/null
          fi
          if [ -d apps/axonwall-satellite ]; then
            cd apps/axonwall-satellite
            CGO_ENABLED=0 go test ./... -v
            cd - >/dev/null
          fi

      - name: Build Axonwall Artifacts
        run: |
          pnpm build

      - name: Compile Axonwalld Core Daemon
        run: |
          cd apps/axonwalld
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/axonwalld .

      - name: Compile Axonwall Console TUI
        run: |
          cd apps/axonwall-console
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/axonwall-console .

      - name: Cross-Compile Satellite Binaries
        run: |
          cd apps/axonwall-satellite
          make all

      - name: Install ISO Build Dependencies
        shell: bash
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial

          # Retry update up to 5 times with exponential backoff
          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt..."
            if sudo apt-get update -y; then
              echo "Update successful"
              break
            fi
            if [ $attempt -lt 5 ]; then
              echo "Update attempt $attempt failed, retrying..."
              sudo rm -rf /var/lib/apt/lists/*
              sudo mkdir -p /var/lib/apt/lists/partial
              sleep $((attempt * 15))
            else
              echo "All update attempts failed"
              exit 1
            fi
          done

          # Install basic dependencies first (including Linux kernel UKI build deps)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o APT::Immediate-Configure=false \
            -o Dpkg::Pre-Install-Pkgs='echo "Skipping pre-install"' \
            bc \
            bison \
            cpio \
            flex \
            libelf-dev \
            libssl-dev \
            xz-utils \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-efi \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            dosfstools \
            mtools \
            qemu-utils || sudo apt-get install -fy --fix-broken

          # Download and install live-build directly. HTTPS + a pinned
          # SHA-256 (cross-checked against the hash published for
          # 1:20250814 in Debian sid's signed Packages index, 2026-10-16):
          # this .deb is installed as root in the release pipeline.
          curl -fsSL -o /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250814_all.deb
          echo "a4bffb8e6436ffba260f2e1c37be9dd04a4dacf52c38d7bbe454ec826ba52a4b  /tmp/live-build.deb" | sha256sum -c -
          sudo dpkg -i /tmp/live-build.deb
          rm -f /tmp/live-build.deb

      - name: Build Super-Slim Edge NGFW UKI (sku-vm-virtio)
        run: |
          ./packaging/edge-uki/build-edge-uki.sh --sku sku-vm-virtio --mode full-uki

      - name: Build Debian (.deb) Package
        run: |
          ./packaging/debian/build-deb.sh

      - name: Sign Debian Package Checksum (if signing key configured)
        env:
          AXONWALL_RELEASE_SIGNING_KEY: ${{ secrets.AXONWALL_RELEASE_SIGNING_KEY }}
        if: env.AXONWALL_RELEASE_SIGNING_KEY != ''
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$AXONWALL_RELEASE_SIGNING_KEY" > "$key_file"
          for sha in packaging/debian/output/*.deb.sha256; do
            openssl dgst -sha256 -sign "$key_file" -out "${sha}.sig" "$sha"
          done

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-debian-package
          path: |
            packaging/debian/output/*.deb
            packaging/debian/output/*.deb.sha256
            packaging/debian/output/*.deb.sha256.sig
          retention-days: 7

      - name: Build Hybrid Appliance ISO (Unified NGFW + Vault Edition)
        run: |
          sudo ./packaging/iso/build-iso.sh

      - name: Build Cloud Appliance Image (QCOW2)
        run: |
          sudo ./packaging/cloud-image/build-qcow2.sh

      - name: Compute Checksums
        run: |
          sudo bash -c 'cd packaging/iso/output && sha256sum axonwall-debian13-amd64.iso > axonwall-debian13-amd64.iso.sha256 && chmod 644 axonwall-debian13-amd64.iso.sha256'
          sudo bash -c 'if [ -d packaging/cloud-image/output ]; then cd packaging/cloud-image/output && sha256sum axonwall-debian13-amd64-cloud.qcow2 > axonwall-debian13-amd64-cloud.qcow2.sha256 && chmod 644 axonwall-debian13-amd64-cloud.qcow2.sha256; fi'
          sudo chown -R $USER:$USER packaging/iso/output packaging/debian/output packaging/cloud-image/output packaging/edge-uki/output 2>/dev/null || true

      - name: Sign ISO, Cloud Image & Edge UKI Checksums (if signing key configured)
        env:
          AXONWALL_RELEASE_SIGNING_KEY: ${{ secrets.AXONWALL_RELEASE_SIGNING_KEY }}
        if: env.AXONWALL_RELEASE_SIGNING_KEY != ''
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$AXONWALL_RELEASE_SIGNING_KEY" > "$key_file"
          for sha in packaging/iso/output/*.iso.sha256 packaging/cloud-image/output/*.qcow2.sha256 packaging/edge-uki/output/*.sha256; do
            if [ -f "$sha" ]; then
              openssl dgst -sha256 -sign "$key_file" -out "${sha}.sig" "$sha"
            fi
          done

      - name: Upload Super-Slim Edge NGFW UKI Artifact (release handoff)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-edge-uki
          path: |
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256.sig
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256.sig
          retention-days: 7

      - name: Upload ISO Checksum Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-debian13-amd64-checksum
          path: packaging/iso/output/axonwall-debian13-amd64.iso.sha256
          retention-days: 1

      - name: Upload Debian ISO Artifact (release handoff)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-debian-iso
          path: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256.sig
          retention-days: 1

      - name: Upload Cloud Appliance QCOW2 Artifact (release handoff)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axonwall-cloud-qcow2
          path: |
            packaging/cloud-image/output/*.qcow2
            packaging/cloud-image/output/*.qcow2.sha256
            packaging/cloud-image/output/*.qcow2.sha256.sig
          retention-days: 1


  release:
    name: Publish Release Artifacts
    needs: build-iso
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Debian Package Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-debian-package
          path: packaging/debian/output

      - name: Download Super-Slim Edge NGFW UKI Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-edge-uki
          path: packaging/edge-uki/output

      - name: Download Debian ISO Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-debian-iso
          path: packaging/iso/output

      - name: Download Cloud Appliance QCOW2 Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: axonwall-cloud-qcow2
          path: packaging/cloud-image/output

      - name: Release Distribution Artifacts (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
            packaging/cloud-image/output/*.qcow2
            packaging/cloud-image/output/*.qcow2.sha256
            packaging/debian/output/*.deb
            packaging/debian/output/*.deb.sha256
            packaging/debian/output/*.deb.sha256.sig
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256.sig
            packaging/cloud-image/output/*.qcow2.sha256.sig
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256.sig
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256.sig

      - name: Publish Rolling Latest Pre-Release (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: rolling-latest
          name: "Axonwall Appliance ISO, Cloud QCOW2, Edge UKI & Debian Package (Rolling Latest)"
          body: |
            ### Automated Continuous Build
            - **Commit**: ${{ github.sha }}
            - **Branch**: `main`
            - **Distribution**:
              - Debian 13 (Trixie) amd64 (Unified Hybrid ISO for NGFW & Vault Editions + Cloud QCOW2 + .deb Package)
              - Super-Slim Edge NGFW UEFI Unified Kernel Image (`sku-vm-virtio` default virtual appliance)
            - **Artifacts**:
              - `axonwall-debian13-amd64.iso` (Unified Next-Gen Installer: Axonwall NGFW + Vault S3 Storage Edition)
              - `axonwall-debian13-amd64-cloud.qcow2`
              - `axonwall-edge-sku-vm-virtio.efi` (Single-File EFI UKI with embedded Go PID 1)
              - `axonwall-edge-sku-vm-virtio-initramfs.cpio.gz`
              - `axonwall_*.deb`
          prerelease: true
          files: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
            packaging/cloud-image/output/*.qcow2
            packaging/cloud-image/output/*.qcow2.sha256
            packaging/debian/output/*.deb
            packaging/debian/output/*.deb.sha256
            packaging/debian/output/*.deb.sha256.sig
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256.sig
            packaging/cloud-image/output/*.qcow2.sha256.sig
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio.efi.sha256.sig
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256
            packaging/edge-uki/output/axonwall-edge-sku-vm-virtio-initramfs.cpio.gz.sha256.sig
