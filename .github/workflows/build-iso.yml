name: Build Axonwall Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-packages:
    name: Build Debian Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: 'apps/**/*.sum'

      - name: Build Axonwall Monorepo Artifacts
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compile Axonwalld Core Daemon
        run: |
          cd apps/axonwalld
          go build -ldflags="-s -w" -o bin/axonwalld .

      - name: Compile Axonwall Console TUI
        run: |
          cd apps/axonwall-console
          go build -ldflags="-s -w" -o bin/axonwall-console .

      - name: Cross-Compile Satellite Binaries
        run: |
          cd apps/axonwall-satellite
          make all

      - name: Build Debian (.deb) Package
        run: |
          ./packaging/debian/build-deb.sh

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axonwall-debian-package
          path: |
            packaging/debian/output/*.deb
            packaging/debian/output/*.deb.sha256
          retention-days: 7

      - name: Release Distribution Artifacts (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/debian/output/*.deb
            packaging/debian/output/*.deb.sha256

      - name: Publish Rolling Latest Pre-Release (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-latest
          name: "Axonwall Debian Packages (Rolling Latest)"
          body: |
            ### Automated Continuous Build
            - **Commit**: ${{ github.sha }}
            - **Branch**: `main`
            - **Distribution**: Debian 13 (Trixie) amd64
            - **Artifacts**: Standalone Debian (.deb) Package
            - **Components**: Axonwalld Core Daemon + Axonwall Web UI + Satellite Agents + Preconfigured Network Engine
          prerelease: true
          files: |
            packaging/debian/output/*.deb
            packaging/debian/output/*.deb.sha256

