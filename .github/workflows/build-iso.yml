name: Build Axonwall Appliance ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Debian 13 Appliance ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: 'apps/**/*.sum'

      - name: Build Axonwall Monorepo Artifacts
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compile Axonwalld Core Daemon
        run: |
          cd apps/axonwalld
          go build -ldflags="-s -w" -o bin/axonwalld main.go

      - name: Cross-Compile Satellite Binaries
        run: |
          cd apps/axonwall-satellite
          make all

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /var/lib/apt/lists/partial
          
          # Retry update up to 5 times with exponential backoff
          for attempt in {1..5}; do
            echo "Update attempt $attempt..."
            if sudo apt-get update -y; then
              echo "Update successful"
              break
            fi
            if [ $attempt -lt 5 ]; then
              echo "Update attempt $attempt failed, retrying..."
              sudo rm -rf /var/lib/apt/lists/*
              sudo mkdir -p /var/lib/apt/lists/partial
              sleep $((attempt * 15))
            else
              echo "All update attempts failed"
              exit 1
            fi
          done
          
          # Install basic dependencies first
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o APT::Immediate-Configure=false \
            -o Dpkg::Pre-Install-Pkgs='echo "Skipping pre-install"' \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools || sudo apt-get install -fy --fix-broken
            
          # Download and install live-build directly
          curl -fsSL -o /tmp/live-build.deb http://deb.debian.org/debian/pool/main/l/live-build/live-build_20250814_all.deb
          sudo dpkg -i /tmp/live-build.deb
          rm -f /tmp/live-build.deb

      - name: Build Hybrid Appliance ISO
        run: |
          sudo ./packaging/iso/build-iso.sh

      - name: Compute Checksums
        run: |
          sudo bash -c 'cd packaging/iso/output && sha256sum axonwall-debian13-amd64.iso > axonwall-debian13-amd64.iso.sha256 && chmod 644 axonwall-debian13-amd64.iso.sha256'
          sudo chown -R $USER:$USER packaging/iso/output

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axonwall-debian13-amd64-iso
          path: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
          retention-days: 14

      - name: Release ISO (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256

      - name: Publish Rolling Latest Pre-Release (on main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-latest
          name: "Axonwall Appliance ISO (Rolling Latest)"
          body: |
            ### Automated Continuous Build
            - **Commit**: ${{ github.sha }}
            - **Branch**: `main`
            - **Distribution**: Debian 13 (Trixie) amd64
            - **Components**: Axonwalld Core Daemon + Axonwall Web UI + Satellite Agents + Preconfigured Network Engine
          prerelease: true
          files: |
            packaging/iso/output/axonwall-debian13-amd64.iso
            packaging/iso/output/axonwall-debian13-amd64.iso.sha256
