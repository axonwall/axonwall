{{- if and .Values.redis.enabled (not .Values.redis.bitnami.enabled) .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
{{- $secretName := include "vigil.redis.passwordSecret" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict -}}
{{- $existingData := ($existing.data | default dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
type: Opaque
data:
  {{ include "vigil.redis.passwordSecretKey" . }}: {{ if .Values.redis.auth.password }}{{ .Values.redis.auth.password | b64enc | quote }}{{ else if hasKey $existingData (include "vigil.redis.passwordSecretKey" .) }}{{ index $existingData (include "vigil.redis.passwordSecretKey" .) | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
{{- end }}
