{{- if .Values.networkPolicies.enabled }}
{{- /*
NetworkPolicies for Vigil SOC.

Default-deny on ingress and restricted egress:
- In-namespace pod-to-pod communication
- CoreDNS (UDP/TCP 53 in kube-system)
- Outbound external API egress explicitly excluding IMDS (169.254.169.254/32)
  and cluster/RFC1918 CIDRs unless allowPrivateEgress is enabled (IMDS remains blocked).
No namespaceSelector: {} app-port bypasses on backend, daemon, agent-worker, or agent-serve.
*/ -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    # In-namespace pod-to-pod communication
    - to:
        - podSelector: {}
    # DNS resolution via kube-system CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound external API egress (LLM providers, threat intel), blocking IMDS 169.254.169.254/32
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- if .Values.networkPolicies.allowPrivateEgress }}
            except:
              - 169.254.169.254/32
            {{- else }}
            except:
              {{- range .Values.networkPolicies.egressExceptCidrs }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- with .Values.networkPolicies.ingressControllerNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.backend.service.port }}
    {{- end }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
---
{{- if .Values.daemon.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "daemon") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- with .Values.networkPolicies.daemon.webhookAllowFrom }}
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $.Values.daemon.ports.webhook }}
    {{- end }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.daemon.ports.webhook }}
        - protocol: TCP
          port: {{ .Values.daemon.ports.metrics }}
        - protocol: TCP
          port: {{ .Values.daemon.ports.health }}
---
{{- end }}
{{- if .Values.llmWorker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-llm-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "llm-worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
---
{{- end }}
{{- if .Values.agentWorker.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-agent-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "agent-worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
---
{{- end }}
{{- if .Values.agentServe.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-agent-serve
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "agent-serve") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-serve") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.agentServe.service.port }}
    {{- if .Values.networkPolicies.agentServe.allowProbesFromAnyNamespace }}
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.agentServe.service.port }}
    {{- end }}
---
{{- end }}
{{- if .Values.bifrost.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "bifrost") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 14 }}
        {{- if .Values.agentWorker.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 14 }}
        {{- end }}
        {{- if .Values.agentServe.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-serve") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.bifrost.service.port | default 8080 }}
---
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.bitnami.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "db-init") | nindent 14 }}
        {{- if .Values.agentWorker.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 14 }}
        {{- end }}
        {{- if .Values.agentServe.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-serve") | nindent 14 }}
        {{- end }}
        {{- if .Values.pgadmin.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "pgadmin") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
---
{{- end }}
{{- if and .Values.redis.enabled (not .Values.redis.bitnami.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vigil.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "daemon") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "llm-worker") | nindent 14 }}
        {{- if .Values.agentWorker.enabled }}
        - podSelector:
            matchLabels:
              {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "agent-worker") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- end }}
{{- end }}
