apiVersion: v2
name: vigil
description: Vigil SOC — open-source, AI-native Security Operations Center
type: application
version: 0.6.0
appVersion: 0.6.0
kubeVersion: '>=1.25.0-0'
home: https://vigilsoc.org
sources:
  - https://github.com/Vigil-SOC/vigil
maintainers:
  - name: Vigil-SOC
    url: https://github.com/Vigil-SOC
keywords:
  - security
  - soc
  - siem
  - ai
  - claude
  - anthropic
  - mcp
icon: https://vigilsoc.org/logo.png
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
dependencies:
  - name: opentelemetry-collector
    version: 0.108.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otelCollector.enabled
    alias: otelCollector
  - name: postgresql
    version: 16.2.2
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.bitnami.enabled
    alias: bitnamiPostgresql
  - name: redis
    version: 20.3.0
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.bitnami.enabled
    alias: bitnamiRedis
