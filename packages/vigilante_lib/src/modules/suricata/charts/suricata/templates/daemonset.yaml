{{- $iface := required "interface is required" .Values.interface -}}
{{- if not (regexMatch "^[a-zA-Z0-9_.:-]+$" $iface) -}}
{{- fail (printf "invalid network interface name %q" $iface) -}}
{{- end -}}
{{- $runMode := required "runMode is required" .Values.runMode -}}
{{- if not (regexMatch "^(workers|autofp|single)$" $runMode) -}}
{{- fail (printf "invalid suricata runMode %q" $runMode) -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "suricata.fullname" . }}
  namespace: {{ include "suricata.namespace" . }}
  labels:
    {{- include "suricata.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "suricata.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "suricata.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: suricata
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          command:
            - suricata
          args:
            - -i
            - {{ $iface | quote }}
            - --runmode
            - {{ $runMode | quote }}
            - -l
            - /var/log/suricata
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /var/log/suricata
              name: var-log-suricata
        {{- if .Values.pcapSpool.enabled }}
        - name: pcap-spooler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/log/suricata /pcap-spool
              while true; do
                for f in /pcap-spool/*.pcap /pcap-spool/*.pcapng; do
                  if [ -f "$f" ]; then
                    echo "[suricata:pcap] Replaying $f..."
                    suricata -r "$f" -l /var/log/suricata --runmode single || true
                    mv "$f" "$f.processed"
                  fi
                done
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /var/log/suricata
              name: var-log-suricata
            - mountPath: /pcap-spool
              name: pcap-spool
        {{- end }}
      volumes:
        - name: var-log-suricata
          emptyDir: {}
        {{- if .Values.pcapSpool.enabled }}
        - name: pcap-spool
          hostPath:
            path: {{ .Values.pcapSpool.path }}
            type: DirectoryOrCreate
        {{- end }}
