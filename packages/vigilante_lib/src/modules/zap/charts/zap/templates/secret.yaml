{{- if not .Values.existingSecret }}
{{- if not .Values.secret.create }}
{{- $_ := required "existingSecret is required when secret.create is false" .Values.existingSecret -}}
{{- end }}
{{- $secretName := printf "%s-secret" (include "zap.fullname" .) -}}
{{- $ns := include "zap.namespace" . -}}
{{- $existing := (lookup "v1" "Secret" $ns $secretName) | default dict -}}
{{- $existingData := ($existing.data | default dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "zap.labels" . | nindent 4 }}
type: Opaque
data:
  ZAP_API_KEY: {{ if .Values.api.key }}{{ .Values.api.key | b64enc | quote }}{{ else if hasKey $existingData "ZAP_API_KEY" }}{{ index $existingData "ZAP_API_KEY" | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
{{- end }}
