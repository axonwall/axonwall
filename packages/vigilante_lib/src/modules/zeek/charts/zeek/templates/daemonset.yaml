{{- $iface := required "interface is required" .Values.interface -}}
{{- if not (regexMatch "^[a-zA-Z0-9_.:-]+$" $iface) -}}
{{- fail (printf "invalid network interface name %q" $iface) -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zeek.fullname" . }}
  namespace: {{ include "zeek.namespace" . }}
  labels:
    {{- include "zeek.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zeek.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zeek.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: zeek
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /usr/local/zeek/logs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          command:
            - zeek
          args:
            - -i
            - {{ $iface | quote }}
            - local
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /usr/local/zeek/logs
              name: zeek-logs
        {{- if .Values.pcapSpool.enabled }}
        - name: pcap-spooler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /usr/local/zeek/logs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /usr/local/zeek/logs /pcap-spool
              while true; do
                for f in /pcap-spool/*.pcap /pcap-spool/*.pcapng; do
                  if [ -f "$f" ]; then
                    echo "[zeek:pcap] Replaying $f..."
                    zeek -r "$f" local || true
                    mv "$f" "$f.processed"
                  fi
                done
                sleep 2
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /usr/local/zeek/logs
              name: zeek-logs
            - mountPath: /pcap-spool
              name: pcap-spool
        {{- end }}
      volumes:
        - name: zeek-logs
          emptyDir: {}
        {{- if .Values.pcapSpool.enabled }}
        - name: pcap-spool
          hostPath:
            path: {{ .Values.pcapSpool.path }}
            type: DirectoryOrCreate
        {{- end }}
