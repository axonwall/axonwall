{{- if .Values.networkPolicy.enabled }}
{{- $ns := include "falco.namespace" . -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "falco.fullname" . }}-sensor
  namespace: {{ $ns }}
  labels:
    {{- include "falco.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "falco.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS resolution via kube-system CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow Falco sensor -> Falcosidekick event delivery in same namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "falco.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: sidekick
      ports:
        - protocol: TCP
          port: 2801
    # Allow Kubernetes API metadata enrichment while blocking IMDS 169.254.169.254/32
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- if .Values.falcosidekick.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "falco.fullname" . }}-sidekick
  namespace: {{ $ns }}
  labels:
    {{- include "falco.labels" . | nindent 4 }}
    app.kubernetes.io/component: sidekick
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "falco.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sidekick
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "falco.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 2801
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.falcosidekick.ui.service.port | default 2802 }}
    {{- if and .Values.ingress.enabled .Values.networkPolicy.ingressControllerNamespaceSelector }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerNamespaceSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.falcosidekick.ui.service.port | default 2802 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- if .Values.networkPolicy.allowWebhookPrivateEgress }}
            except:
              - 169.254.169.254/32
            {{- else }}
            except:
              {{- range .Values.networkPolicy.egressExceptCidrs }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
{{- end }}
{{- end }}
