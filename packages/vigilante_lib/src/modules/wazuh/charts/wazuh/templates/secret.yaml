{{- if not .Values.existingSecret }}
{{- $secretName := printf "%s-secrets" (include "wazuh.fullname" .) -}}
{{- $ns := include "wazuh.namespace" . -}}
{{- $existing := (lookup "v1" "Secret" $ns $secretName) | default dict -}}
{{- $existingData := ($existing.data | default dict) -}}
{{- $indexerUser := .Values.credentials.indexerUsername | default "admin" -}}
{{- $dashboardUser := .Values.credentials.dashboardUsername | default "kibanaserver" -}}
{{- $indexerPass := .Values.credentials.indexerPassword -}}
{{- if and (not $indexerPass) (hasKey $existingData "INDEXER_PASSWORD") -}}
{{- $indexerPass = index $existingData "INDEXER_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $indexerPass -}}
{{- $indexerPass = randAlphaNum 24 -}}
{{- end -}}
{{- $dashboardPass := .Values.credentials.dashboardPassword -}}
{{- if and (not $dashboardPass) (hasKey $existingData "DASHBOARD_PASSWORD") -}}
{{- $dashboardPass = index $existingData "DASHBOARD_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $dashboardPass -}}
{{- $dashboardPass = randAlphaNum 24 -}}
{{- end -}}
{{- $apiPass := .Values.credentials.apiPassword -}}
{{- if and (not $apiPass) (hasKey $existingData "API_PASSWORD") -}}
{{- $apiPass = index $existingData "API_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $apiPass -}}
{{- $apiPass = randAlphaNum 24 -}}
{{- end -}}
{{- $internalUsers := "" -}}
{{- if and (not .Values.credentials.indexerPassword) (not .Values.credentials.dashboardPassword) (hasKey $existingData "internal_users.yml") -}}
{{- $internalUsers = index $existingData "internal_users.yml" | b64dec -}}
{{- else -}}
{{- $indexerHash := htpasswd $indexerUser $indexerPass | trimPrefix (printf "%s:" $indexerUser) -}}
{{- $dashboardHash := htpasswd $dashboardUser $dashboardPass | trimPrefix (printf "%s:" $dashboardUser) -}}
{{- $internalUsers = printf "---\n_meta:\n  type: \"internalusers\"\n  config_version: 2\n\n%s:\n  hash: %q\n  reserved: true\n  backend_roles:\n    - \"admin\"\n  description: \"Wazuh indexer admin user\"\n\n%s:\n  hash: %q\n  reserved: true\n  description: \"Wazuh dashboard service user\"\n" $indexerUser $indexerHash $dashboardUser $dashboardHash -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
type: Opaque
data:
  INDEXER_PASSWORD: {{ $indexerPass | b64enc | quote }}
  DASHBOARD_PASSWORD: {{ $dashboardPass | b64enc | quote }}
  API_PASSWORD: {{ $apiPass | b64enc | quote }}
  internal_users.yml: {{ $internalUsers | b64enc | quote }}
{{- end }}
