{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvas.fullname" . }}-admin
  namespace: {{ template "openvas.namespace" . }}
  labels:
    {{- include "openvas.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.admin.username | default "admin" | quote }}
  password: {{ required "admin.password or existingSecret is required" .Values.admin.password | quote }}
  postgresPassword: {{ required "psgvm.password or existingSecret is required" .Values.psgvm.password | quote }}
{{- end }}
