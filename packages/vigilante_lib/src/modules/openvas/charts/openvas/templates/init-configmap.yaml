apiVersion: v1
kind: ConfigMap
metadata:
  name: init-scripts-config
  namespace: {{ template "openvas.namespace" . }}
  labels:
    {{- include "openvas.labels" . | nindent 4 }}
data:
  init-postgres.sh: |
    #!/bin/sh
    set -u

    log() { echo "[INFO] $*"; }
    warn() { echo "[WARN] $*"; }
    err() { echo "[ERROR] $*" >&2; }

    [ -z "${POSTGRES_USER:-}" ] && POSTGRES_USER="gvmd"
    [ -z "${POSTGRES_DATA:-}" ] && POSTGRES_DATA="/var/lib/postgresql"
    [ -z "${POSTGRES_HOST_AUTH_METHOD:-}" ] && POSTGRES_HOST_AUTH_METHOD="scram-sha-256"
    [ -z "${POSTGRES_VERSION:-}" ] && POSTGRES_VERSION=17

    if [ -z "${POSTGRES_PASSWORD:-}" ]; then
      err "POSTGRES_PASSWORD is empty; refusing to initialize PostgreSQL without credentials."
      exit 1
    fi

    POSTGRES_DB=gvmd
    POSTGRES_HBA_CONF="/etc/postgresql/$POSTGRES_VERSION/main/pg_hba.conf"
    POSTGRES_SETUP_DIR="/mnt/postgresql/main"
    POSTGRES_SOCKET_DIR="/run/postgresql"

    log "Checking if PostgreSQL is already initialized..."
    if [ -d "$POSTGRES_SETUP_DIR" ]; then
      log "PostgreSQL already set up at $POSTGRES_SETUP_DIR, skipping."
      exit 0
    fi

    HBA_DIR="$(dirname "$POSTGRES_HBA_CONF")"
    if [ -d "$HBA_DIR" ] && [ -w "$HBA_DIR" ]; then
      log "Writing pg_hba.conf with peer local auth and $POSTGRES_HOST_AUTH_METHOD host auth"
      {
        echo "local all all peer"
        echo "host all all all $POSTGRES_HOST_AUTH_METHOD"
      } > "$POSTGRES_HBA_CONF" 2>/dev/null || true
    fi

    rm -f "$POSTGRES_DATA/started" 2>/dev/null || true

    if command -v pg_ctlcluster >/dev/null 2>&1; then
      log "Starting temporary PostgreSQL cluster for initial setup..."
      pg_ctlcluster "$POSTGRES_VERSION" main start || true

      if command -v pg_isready >/dev/null 2>&1; then
        i=0
        while [ $i -lt 30 ]; do
          pg_isready -h "$POSTGRES_SOCKET_DIR" -U postgres >/dev/null 2>&1 && break
          i=$((i+1))
          sleep 1
        done
      fi

      su -s /bin/sh -c '
        set -eu
        PG_USER="$1"
        PG_PASS="$2"
        PG_DB="$3"
        PG_SOCK="$4"

        USER_EXISTS="$(printf "%s\n" "SELECT 1 FROM pg_roles WHERE rolname = :'\''user'\'';" | psql --host="$PG_SOCK" -U postgres -d postgres -tA -v user="$PG_USER" || true)"
        if [ -z "$USER_EXISTS" ]; then
          printf "%s\n" "CREATE ROLE :\"user\" WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;" | psql --host="$PG_SOCK" -U postgres -d postgres -v ON_ERROR_STOP=1 -v user="$PG_USER"
        fi

        printf "%s\n" "ALTER USER :\"user\" WITH PASSWORD :'\''pass'\'';" | psql --host="$PG_SOCK" -U postgres -d postgres -v ON_ERROR_STOP=1 -v user="$PG_USER" -v pass="$PG_PASS"

        DB_EXISTS="$(printf "%s\n" "SELECT 1 FROM pg_database WHERE datname = :'\''db'\'';" | psql --host="$PG_SOCK" -U postgres -d postgres -tA -v db="$PG_DB" || true)"
        if [ -z "$DB_EXISTS" ]; then
          printf "%s\n" "CREATE DATABASE :\"db\" OWNER :\"user\";" | psql --host="$PG_SOCK" -U postgres -d postgres -v ON_ERROR_STOP=1 -v user="$PG_USER" -v db="$PG_DB"
        fi

        printf "%s\n" \
          "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";" \
          "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";" \
          "CREATE EXTENSION IF NOT EXISTS \"pg-gvm\";" \
          "GRANT USAGE, CREATE ON SCHEMA public TO :\"user\";" \
          | psql --host="$PG_SOCK" -U postgres -d "$PG_DB" -v ON_ERROR_STOP=1 -v user="$PG_USER"
      ' - -- postgres -- "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" "$POSTGRES_SOCKET_DIR"

      pg_ctlcluster "$POSTGRES_VERSION" main stop 2>/dev/null || true
    fi

    log "Populating persistent volume mount /mnt/postgresql..."
    cp -ra /var/lib/postgresql/* /mnt/postgresql/ 2>/dev/null || true
    mkdir -p "$POSTGRES_SETUP_DIR" 2>/dev/null || true
    log "PostgreSQL initialization completed successfully."

  bootstrap-admin.sh: |
    #!/bin/sh
    set -u
    log() { echo "[INFO] $*"; }

    ADMIN_USER="${ADMIN_USERNAME:-admin}"
    ADMIN_PASS="${ADMIN_PASSWORD:-}"
    if [ -z "$ADMIN_PASS" ]; then
      echo "[ERROR] ADMIN_PASSWORD is empty; refusing to bootstrap gvmd admin user." >&2
      exit 1
    fi

    log "Waiting for gvmd socket..."
    i=0
    while [ $i -lt 120 ]; do
      if [ -S /run/gvmd/gvmd.sock ]; then
        break
      fi
      i=$((i+1))
      sleep 2
    done

    if [ ! -S /run/gvmd/gvmd.sock ]; then
      echo "[ERROR] gvmd socket not available after 240s, aborting bootstrap." >&2
      exit 1
    fi

    log "Waiting for gvmd database connection..."
    j=0
    while [ $j -lt 60 ]; do
      if su -s /bin/sh -c 'exec /usr/local/sbin/gvmd --get-users' - gvmd >/dev/null 2>&1; then
        break
      fi
      j=$((j+1))
      sleep 2
    done

    log "Ensuring admin user '$ADMIN_USER' exists in gvmd..."
    if su -s /bin/sh -c 'exec /usr/local/sbin/gvmd --get-users' - gvmd 2>/dev/null | awk '{print $1}' | grep -Fxq -- "$ADMIN_USER"; then
      su -s /bin/sh -c 'exec /usr/local/sbin/gvmd --user="$1" --new-password="$2"' - -- gvmd -- "$ADMIN_USER" "$ADMIN_PASS"
      log "Admin user '$ADMIN_USER' password updated."
    else
      su -s /bin/sh -c 'exec /usr/local/sbin/gvmd --create-user="$1" --password="$2" --role=Admin --disable-password-policy' - -- gvmd -- "$ADMIN_USER" "$ADMIN_PASS"
      log "Admin user '$ADMIN_USER' created successfully."
    fi
