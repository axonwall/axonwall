{{- if not .Values.existingSecret }}
{{- $pgPass := required "postgres.password or existingSecret is required" .Values.postgres.password -}}
{{- $neoPass := required "neo4j.password or existingSecret is required" .Values.neo4j.password -}}
{{- $admPass := required "admin.password or existingSecret is required" .Values.admin.password -}}
{{- $pgHost := printf "%s-postgres" (include "bloodhound.fullname" .) -}}
{{- $neoHost := printf "%s-neo4j" (include "bloodhound.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bloodhound.fullname" . }}-secrets
  namespace: {{ include "bloodhound.namespace" . }}
  labels:
    {{- include "bloodhound.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  NEO4J_PASSWORD: {{ $neoPass | quote }}
  NEO4J_AUTH: {{ printf "neo4j/%s" $neoPass | quote }}
  ADMIN_PASSWORD: {{ $admPass | quote }}
  BHE_DATABASE_CONNECTION: {{ printf "postgresql://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.username $pgPass $pgHost .Values.postgres.database | quote }}
  BHE_NEO4J_CONNECTION: {{ printf "neo4j://neo4j:%s@%s:7687" $neoPass $neoHost | quote }}
{{- end }}
