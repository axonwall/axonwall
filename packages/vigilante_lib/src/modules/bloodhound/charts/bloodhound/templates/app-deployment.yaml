{{- $secretName := .Values.existingSecret | default (printf "%s-secrets" (include "bloodhound.fullname" .)) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bloodhound.fullname" . }}
  namespace: {{ include "bloodhound.namespace" . }}
  labels:
    {{- include "bloodhound.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bloodhound.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "bloodhound.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: bloodhound
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: bhe_database_connection
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: BHE_DATABASE_CONNECTION
            - name: bhe_database_addr
              value: "{{ include "bloodhound.fullname" . }}-postgres:5432"
            - name: bhe_database_database
              value: {{ .Values.postgres.database | quote }}
            - name: bhe_database_username
              value: {{ .Values.postgres.username | quote }}
            - name: bhe_database_password
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD
            - name: bhe_neo4j_connection
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: BHE_NEO4J_CONNECTION
            - name: bhe_neo4j_addr
              value: "{{ include "bloodhound.fullname" . }}-neo4j:7687"
            - name: bhe_neo4j_username
              value: "neo4j"
            - name: bhe_neo4j_password
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: NEO4J_PASSWORD
            - name: bhe_default_admin_principal_name
              value: {{ .Values.admin.principalName | quote }}
            - name: bhe_default_admin_password
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
